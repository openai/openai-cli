name: Set up compatibility Go
description: Keep native compatibility compilation separate from other Go jobs
inputs:
  cache-compilation:
    description: Use the revisioned cache maintained by the main-branch producer
    default: 'false'
outputs:
  cache-key:
    description: Native cache key resolved before SDK source linking
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-hit:
    description: Whether the exact native cache key was restored
    value: ${{ steps.cache.outputs.cache-hit }}
  build-cache:
    description: Go compilation cache directory
    value: ${{ steps.paths.outputs.build }}
  module-cache:
    description: Go module cache directory
    value: ${{ steps.paths.outputs.modules }}
runs:
  using: composite
  steps:
    - name: Set up Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .go-version
        check-latest: true
        cache: ${{ inputs.cache-compilation != 'true' }}
    - name: Locate native compatibility caches
      if: inputs.cache-compilation == 'true'
      id: paths
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - name: Restore native compatibility compilation
      if: inputs.cache-compilation == 'true'
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.paths.outputs.build }}
          ${{ steps.paths.outputs.modules }}
        # Only the main-branch warmer saves these caches. Required test jobs
        # must not spend their remaining timeout compressing cache archives.
        key: native-compat-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          native-compat-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
