---
name: Publish Release

permissions: {}

concurrency:
  group: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.2.3"
        required: true
        type: string
jobs:
  release-inputs:
    if: github.repository == 'openai/openai-cli'
    runs-on: ubuntu-latest
    outputs:
      tag-sha: ${{ steps.trusted-tag.outputs.sha }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .go-version
        check-latest: true
        cache: false
    - name: Ensure release tag is on main
      id: trusted-tag
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        case "$TAG" in
          v*) ;;
          *) echo "Release tag must start with v: $TAG"; exit 1 ;;
        esac
        git check-ref-format "refs/tags/$TAG"

        set +x
        export GIT_TRACE=0 GIT_TRACE_PACKET=0 GIT_TRACE_CURL=0 GIT_CURL_VERBOSE=0
        auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        printf '::add-mask::%s\n' "$auth_header"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header"

        repository_origin="https://github.com/${GITHUB_REPOSITORY}.git"
        remote_tag="$(git ls-remote --exit-code --tags --refs "$repository_origin" "refs/tags/$TAG")"
        remote_ref="$(printf '%s\n' "$remote_tag" | awk '{print $2}')"
        test "$remote_ref" = "refs/tags/$TAG"

        git fetch --no-tags "$repository_origin" +refs/heads/main:refs/remotes/origin/main
        git fetch --no-tags "$repository_origin" "+refs/tags/$TAG:refs/tags/$TAG"

        local_ref="$(git for-each-ref --format='%(refname)' "refs/tags/$TAG")"
        test "$local_ref" = "refs/tags/$TAG"

        tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
        echo "Release tag $TAG resolves to $tag_sha"
        git merge-base --is-ancestor "$tag_sha" origin/main
        git checkout --detach "$tag_sha"
        test "$(git rev-parse HEAD)" = "$tag_sha"
        echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
    - name: Identify a published historical release
      id: historical-release
      env:
        TAG: ${{ inputs.tag }}
        TAG_SHA: ${{ steps.trusted-tag.outputs.sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # v1.51.5 was the last public release before model verification.
        cutoff_sha=e0ba427a67fa11123032835cfe191a500109f635
        if ! git merge-base --is-ancestor "$TAG_SHA" "$cutoff_sha"; then
          exit 0
        fi
        version=$(git show "$TAG_SHA:.release-please-manifest.json" | jq -er '.["."]')
        [[ "$TAG" == "v$version" && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | jq -se \
          --arg tag "$TAG" --arg sha "$TAG_SHA" '
            select(length == 1) | .[0] |
            .tag_name == $tag and .draft == false and .prerelease == false and
            (.published_at | fromdateiso8601 | todateiso8601) == .published_at and
            .published_at <= "2026-11-07T19:56:35Z" and
            (.target_commitish == $sha or
              ($tag == "v1.0.0" and $sha == "7d2ebbdcb1ab7e05957d09986e8b5e4d707a9675" and
               .id == 318075758 and .target_commitish == "main"))
          ' > /dev/null
        echo "repair=true" >> "$GITHUB_OUTPUT"
    - name: Verify model defaults for the release tag
      if: steps.historical-release.outputs.repair != 'true'
      run: python3 -I scripts/check-model-defaults.py
    - name: Generate release inputs
      run: |
        mkdir -p completions
        go run ./cmd/openai/main.go @completion bash > completions/openai.bash
        go run ./cmd/openai/main.go @completion zsh > completions/openai.zsh
        go run ./cmd/openai/main.go @completion fish > completions/openai.fish
        # Historical tags did not ship the Linux fish picker asset.
        if grep -Fq 'src: completions/picker/openai.fish' .goreleaser.yml; then
          mkdir -p completions/picker
          go run ./scripts/render-linux-picker > completions/picker/openai.fish
        fi
        go run ./cmd/openai/main.go @manpages -o man
    - name: Stage isolated release inputs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: openai-release-inputs
        path: |
          completions/openai.bash
          completions/openai.zsh
          completions/openai.fish
          completions/picker/openai.fish
          man/man1/openai.1.gz
        if-no-files-found: error
        retention-days: 1

  goreleaser:
    needs: release-inputs
    if: github.repository == 'openai/openai-cli'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up verified GoReleaser
      id: goreleaser
      uses: ./.github/actions/setup-goreleaser
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .go-version
        check-latest: true
        cache: false
    - name: Preserve trusted vulnerability scanner
      run: install -m 0755 ./scripts/govulncheck "$RUNNER_TEMP/openai-cli-govulncheck"
    - name: Ensure release tag is on main
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        EXPECTED_TAG_SHA: ${{ needs.release-inputs.outputs.tag-sha }}
      run: |
        case "$TAG" in
          v*) ;;
          *) echo "Release tag must start with v: $TAG"; exit 1 ;;
        esac
        git check-ref-format "refs/tags/$TAG"

        set +x
        export GIT_TRACE=0 GIT_TRACE_PACKET=0 GIT_TRACE_CURL=0 GIT_CURL_VERBOSE=0
        auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        printf '::add-mask::%s\n' "$auth_header"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header"

        repository_origin="https://github.com/${GITHUB_REPOSITORY}.git"
        remote_tag="$(git ls-remote --exit-code --tags --refs "$repository_origin" "refs/tags/$TAG")"
        remote_ref="$(printf '%s\n' "$remote_tag" | awk '{print $2}')"
        test "$remote_ref" = "refs/tags/$TAG"

        git fetch --no-tags "$repository_origin" +refs/heads/main:refs/remotes/origin/main
        git fetch --no-tags "$repository_origin" "+refs/tags/$TAG:refs/tags/$TAG"

        local_ref="$(git for-each-ref --format='%(refname)' "refs/tags/$TAG")"
        test "$local_ref" = "refs/tags/$TAG"

        tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
        echo "Release tag $TAG resolves to $tag_sha"
        test "$tag_sha" = "$EXPECTED_TAG_SHA"
        git merge-base --is-ancestor "$tag_sha" origin/main
        git checkout --detach "$tag_sha"
        test "$(git rev-parse HEAD)" = "$tag_sha"
    - name: Check shipped CLI for reachable vulnerabilities
      run: |
        "$RUNNER_TEMP/openai-cli-govulncheck" "$GITHUB_WORKSPACE"
    - name: Download isolated release inputs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: openai-release-inputs
        path: ${{ runner.temp }}/openai-release-inputs
    - name: Verify isolated release inputs
      env:
        RELEASE_INPUT_DIR: ${{ runner.temp }}/openai-release-inputs
      run: |
        set -euo pipefail

        if [[ ! -d "$RELEASE_INPUT_DIR" || -L "$RELEASE_INPUT_DIR" ]]; then
          echo "Release inputs must be a real directory"
          exit 1
        fi

        inputs=(completions/openai.bash completions/openai.zsh completions/openai.fish man/man1/openai.1.gz)
        package_picker=false
        if grep -Fq 'src: completions/picker/openai.fish' .goreleaser.yml; then
          package_picker=true
          inputs+=(completions/picker/openai.fish)
        fi

        while IFS= read -r -d '' path; do
          relative="${path#"$RELEASE_INPUT_DIR"/}"
          case "$relative" in
            completions|man|man/man1)
              [[ -d "$path" && ! -L "$path" ]] || exit 1
              ;;
            completions/picker)
              [[ "$package_picker" == true && -d "$path" && ! -L "$path" ]] || exit 1
              ;;
            completions/picker/openai.fish)
              [[ "$package_picker" == true && -f "$path" && ! -L "$path" ]] || exit 1
              size="$(wc -c < "$path")"
              [[ "$size" -gt 0 && "$size" -le 10485760 ]] || exit 1
              ;;
            completions/openai.bash|completions/openai.zsh|completions/openai.fish|man/man1/openai.1.gz)
              [[ -f "$path" && ! -L "$path" ]] || exit 1
              size="$(wc -c < "$path")"
              if [[ "$size" -eq 0 || "$size" -gt 10485760 ]]; then
                echo "Release input has an invalid size: $relative"
                exit 1
              fi
              ;;
            *)
              echo "Unexpected release input: $relative"
              exit 1
              ;;
          esac
        done < <(find "$RELEASE_INPUT_DIR" -mindepth 1 -print0)

        for path in "${inputs[@]}"; do
          [[ -f "$RELEASE_INPUT_DIR/$path" && ! -L "$RELEASE_INPUT_DIR/$path" ]] || exit 1
        done

        mkdir -p completions man/man1
        if [[ "$package_picker" == true ]]; then mkdir -p completions/picker; fi
        for path in "${inputs[@]}"; do
          install -m 0644 "$RELEASE_INPUT_DIR/$path" "$path"
        done

        exclude_file="$(git rev-parse --git-path info/exclude)"
        printf '/%s\n' "${inputs[@]}" >> "$exclude_file"
    - name: Stage versioned Linux installer
      if: ${{ hashFiles('scripts/install-linux-release.sh') != '' }}
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        [[ -f scripts/install-linux-release.sh && ! -L scripts/install-linux-release.sh ]]
        mkdir -m 0700 .release-installers
        installer=.release-installers/install-linux-release.sh
        test "$(grep -Fxc "  tag=''" scripts/install-linux-release.sh)" = 1
        sed "s/^  tag=''$/  tag='$RELEASE_TAG'/" scripts/install-linux-release.sh > "$installer"
        printf '/%s\n' "$installer" >> "$(git rev-parse --git-path info/exclude)"
        printf 'OPENAI_LINUX_RELEASE_INSTALLER=%s\n' "$installer" >> "$GITHUB_ENV"
        # Older releases have only the version-stamped installer.
        if grep -Fq 'glob: scripts/openai.sh' .goreleaser.yml; then
          [[ -f scripts/openai.sh && ! -L scripts/openai.sh && -f scripts/openai.sha256 && ! -L scripts/openai.sha256 ]]
          (cd scripts && shasum -a 256 openai.sh | cmp - openai.sha256)
          printf 'OPENAI_LINUX_LAUNCHER=scripts/openai.sh\n' >> "$GITHUB_ENV"
        fi
    - name: Create release app token for this repo
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        permission-contents: write
    - name: Create release app token for homebrew-tools
      id: tap-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        owner: openai
        repositories: homebrew-tools
        permission-contents: write
        permission-pull-requests: write
    - name: Run GoReleaser
      run: |
        "$GORELEASER_EXECUTABLE" release --clean --skip=before
      env:
        GORELEASER_EXECUTABLE: ${{ steps.goreleaser.outputs.executable }}
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
        GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
        MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
        MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    - name: Include the published Linux installers in release attestations
      if: ${{ env.OPENAI_LINUX_RELEASE_INSTALLER != '' }}
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        installers=("$OPENAI_LINUX_RELEASE_INSTALLER")
        if [[ -n ${OPENAI_LINUX_LAUNCHER:-} ]]; then installers+=("$OPENAI_LINUX_LAUNCHER"); fi
        for installer in "${installers[@]}"; do
          name=${installer##*/}
          install -m 0644 "$installer" "dist/$name"
          (cd dist && grep -Fxq "$(shasum -a 256 "$name")" "openai_${RELEASE_TAG#v}_checksums.txt")
        done
    - name: Stage release artifacts for attestation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-artifacts
        path: dist/*
        if-no-files-found: error
        retention-days: 1

  attest:
    name: attest
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-artifacts
        path: dist
    - name: Attest release artifacts
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/*
    - name: Verify release artifact attestations
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        find dist -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
          gh attestation verify "$file" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-release.yml"
        done
