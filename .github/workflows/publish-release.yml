---
name: Publish Release

permissions: {}

concurrency:
  group: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.2.3"
        required: true
        type: string
jobs:
  release-inputs:
    if: github.repository == 'openai/openai-cli'
    runs-on: ubuntu-latest
    outputs:
      tag-sha: ${{ steps.trusted-tag.outputs.sha }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Ensure release tag is on main
      id: trusted-tag
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        case "$TAG" in
          v*) ;;
          *) echo "Release tag must start with v: $TAG"; exit 1 ;;
        esac
        git check-ref-format "refs/tags/$TAG"

        set +x
        export GIT_TRACE=0 GIT_TRACE_PACKET=0 GIT_TRACE_CURL=0 GIT_CURL_VERBOSE=0
        auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        printf '::add-mask::%s\n' "$auth_header"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header"

        repository_origin="https://github.com/${GITHUB_REPOSITORY}.git"
        remote_tag="$(git ls-remote --exit-code --tags --refs "$repository_origin" "refs/tags/$TAG")"
        remote_ref="$(printf '%s\n' "$remote_tag" | awk '{print $2}')"
        test "$remote_ref" = "refs/tags/$TAG"

        git fetch --no-tags "$repository_origin" +refs/heads/main:refs/remotes/origin/main
        git fetch --no-tags "$repository_origin" "+refs/tags/$TAG:refs/tags/$TAG"

        local_ref="$(git for-each-ref --format='%(refname)' "refs/tags/$TAG")"
        test "$local_ref" = "refs/tags/$TAG"

        tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
        echo "Release tag $TAG resolves to $tag_sha"
        git merge-base --is-ancestor "$tag_sha" origin/main
        git checkout --detach "$tag_sha"
        test "$(git rev-parse HEAD)" = "$tag_sha"
        echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: "go.mod"
        cache: false
    - name: Generate release inputs
      run: |
        mkdir -p completions
        go run ./cmd/openai/main.go @completion bash > completions/openai.bash
        go run ./cmd/openai/main.go @completion zsh > completions/openai.zsh
        go run ./cmd/openai/main.go @completion fish > completions/openai.fish
        go run ./cmd/openai/main.go @manpages -o man
    - name: Stage isolated release inputs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: openai-release-inputs
        path: |
          completions/openai.bash
          completions/openai.zsh
          completions/openai.fish
          man/man1/openai.1.gz
        if-no-files-found: error
        retention-days: 1

  goreleaser:
    needs: release-inputs
    if: github.repository == 'openai/openai-cli'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up verified GoReleaser
      uses: ./.github/actions/setup-goreleaser
    - name: Ensure release tag is on main
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        EXPECTED_TAG_SHA: ${{ needs.release-inputs.outputs.tag-sha }}
      run: |
        case "$TAG" in
          v*) ;;
          *) echo "Release tag must start with v: $TAG"; exit 1 ;;
        esac
        git check-ref-format "refs/tags/$TAG"

        set +x
        export GIT_TRACE=0 GIT_TRACE_PACKET=0 GIT_TRACE_CURL=0 GIT_CURL_VERBOSE=0
        auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        printf '::add-mask::%s\n' "$auth_header"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header"

        repository_origin="https://github.com/${GITHUB_REPOSITORY}.git"
        remote_tag="$(git ls-remote --exit-code --tags --refs "$repository_origin" "refs/tags/$TAG")"
        remote_ref="$(printf '%s\n' "$remote_tag" | awk '{print $2}')"
        test "$remote_ref" = "refs/tags/$TAG"

        git fetch --no-tags "$repository_origin" +refs/heads/main:refs/remotes/origin/main
        git fetch --no-tags "$repository_origin" "+refs/tags/$TAG:refs/tags/$TAG"

        local_ref="$(git for-each-ref --format='%(refname)' "refs/tags/$TAG")"
        test "$local_ref" = "refs/tags/$TAG"

        tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
        echo "Release tag $TAG resolves to $tag_sha"
        test "$tag_sha" = "$EXPECTED_TAG_SHA"
        git merge-base --is-ancestor "$tag_sha" origin/main
        git checkout --detach "$tag_sha"
        test "$(git rev-parse HEAD)" = "$tag_sha"
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: "go.mod"
    - name: Download isolated release inputs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: openai-release-inputs
        path: ${{ runner.temp }}/openai-release-inputs
    - name: Verify isolated release inputs
      env:
        RELEASE_INPUT_DIR: ${{ runner.temp }}/openai-release-inputs
      run: |
        set -euo pipefail

        if [[ ! -d "$RELEASE_INPUT_DIR" || -L "$RELEASE_INPUT_DIR" ]]; then
          echo "Release inputs must be a real directory"
          exit 1
        fi

        while IFS= read -r -d '' path; do
          relative="${path#"$RELEASE_INPUT_DIR"/}"
          case "$relative" in
            completions|man|man/man1)
              [[ -d "$path" && ! -L "$path" ]] || exit 1
              ;;
            completions/openai.bash|completions/openai.zsh|completions/openai.fish|man/man1/openai.1.gz)
              [[ -f "$path" && ! -L "$path" ]] || exit 1
              size="$(wc -c < "$path")"
              if [[ "$size" -eq 0 || "$size" -gt 10485760 ]]; then
                echo "Release input has an invalid size: $relative"
                exit 1
              fi
              ;;
            *)
              echo "Unexpected release input: $relative"
              exit 1
              ;;
          esac
        done < <(find "$RELEASE_INPUT_DIR" -mindepth 1 -print0)

        for path in completions/openai.bash completions/openai.zsh completions/openai.fish man/man1/openai.1.gz; do
          [[ -f "$RELEASE_INPUT_DIR/$path" && ! -L "$RELEASE_INPUT_DIR/$path" ]] || exit 1
        done

        mkdir -p completions man/man1
        for path in completions/openai.bash completions/openai.zsh completions/openai.fish man/man1/openai.1.gz; do
          install -m 0644 "$RELEASE_INPUT_DIR/$path" "$path"
        done

        exclude_file="$(git rev-parse --git-path info/exclude)"
        printf '%s\n' \
          '/completions/openai.bash' \
          '/completions/openai.zsh' \
          '/completions/openai.fish' \
          '/man/man1/openai.1.gz' \
          >> "$exclude_file"
    - name: Create release app token for this repo
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        permission-contents: write
    - name: Create release app token for homebrew-tools
      id: tap-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        owner: openai
        repositories: homebrew-tools
        permission-contents: write
        permission-pull-requests: write
    - name: Run GoReleaser
      run: goreleaser release --clean --skip=before
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
        GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
        MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
        MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    - name: Stage release artifacts for attestation
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-artifacts
        path: dist/*
        if-no-files-found: error
        retention-days: 1

  attest:
    name: attest
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: release-artifacts
        path: dist
    - name: Attest release artifacts
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
      with:
        subject-path: dist/*
    - name: Verify release artifact attestations
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        find dist -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
          gh attestation verify "$file" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-release.yml"
        done
