name: Publish CodeQL results

on:
  workflow_run:
    workflows: [CodeQL, CI]
    types: [requested, in_progress, completed]

permissions: {}

concurrency:
  group: codeql-upload-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id) || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.event.workflow_run.path == '.github/workflows/codeql.yml'
    runs-on: ubuntu-latest
    # Four SARIF uploads can each take up to five minutes to process.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
      statuses: write
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify and publish CodeQL results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/codeql_upload.py publish

  ci-status:
    if: github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Publish verified CI statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/codeql_upload.py publish-ci
