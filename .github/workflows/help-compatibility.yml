                      '--mtls-client-cert-file=/--mtls-client-cert-file=/models/list',
                      '--mtls-client-cert-file=/models/--mtls-client-cert-file=/list',
                      '--mtls-client-key-file=/--mtls-client-key-file=/models/list',
                      '--mtls-client-key-file=/models/--mtls-client-key-file=/list',
                      'models/--mtls-client-cert-file=/list/--mtls-client-cert-file=',
                      'models/--mtls-client-key-file=/list/--mtls-client-key-file=',
                  ],
                  'TestMainGlobalFlagCompletionScriptsIgnoreRequestConfiguration': [
                      'bash/certificate_only', 'bash/endpoint', 'bash/invalid_endpoint', 'bash/key_only',
                      'bash/missing_files', 'fish/certificate_only', 'fish/endpoint', 'fish/invalid_endpoint',
                      'fish/key_only', 'fish/missing_files', 'pwsh/certificate_only', 'pwsh/endpoint',
                      'pwsh/invalid_endpoint', 'pwsh/key_only', 'pwsh/missing_files', 'zsh/certificate_only',
                      'zsh/endpoint', 'zsh/invalid_endpoint', 'zsh/key_only', 'zsh/missing_files',
                  ],
                  'TestMainGlobalFlagCompletionWordsRemainRequestValues': [
                      '@completion/equals', '@completion/spaced', '__complete/equals', '__complete/spaced',
                  ],
                  'TestMainGlobalFlagRequestConfigurationStillValidates': [
                      'certificate_only/@completion', 'certificate_only/__complete', 'certificate_only/ordinary',
                      'empty_endpoint_fallback/@completion', 'empty_endpoint_fallback/__complete',
                      'empty_endpoint_fallback/ordinary', 'invalid_environment/@completion',
                      'invalid_environment/__complete', 'invalid_environment/ordinary',
                      'invalid_explicit_endpoint/@completion', 'invalid_explicit_endpoint/__complete',
                      'invalid_explicit_endpoint/ordinary', 'key_only/@completion', 'key_only/__complete',
                      'key_only/ordinary', 'missing_files/@completion', 'missing_files/__complete',
                      'missing_files/ordinary',
                  ],
                  'TestMainGlobalFlagURLConfigurationPreservesOfflineHelp': [
                      'help/imaginary/json', 'help/imaginary/text', 'help/json', 'help/models/imaginary/json',
                      'help/models/imaginary/text', 'help/models/list/json', 'help/models/list/text', 'help/setup/json',
                      'help/setup/text', 'help/text',
                  ],
              }
              suites["request-configuration-public-tests.jsonl"] = set().union(*(
                  required_cases(root, children) for root, children in request_public_cases.items()
              ))
              request_configuration_packages["request-configuration-public-tests.jsonl"] = "github.com/openai/openai-cli/cmd/openai"
              request_helper_cases = {
                  'TestRootRequestFlagsPreserveOwnershipAndMetadata': [],
                  'TestRootRequestFlagsPreserveMTLSPlacement': [],
                  'TestRootRequestFlagsRetainSourcesAliasesAndValidation': [
                      'environment', 'alias', 'empty', 'duplicate', 'validation',
                  ],
                  'TestMTLSClientFlagEnvironmentDoesNotConsumeExplicitValue': [],
              }
              suites["request-configuration-helper-tests.jsonl"] = set().union(*(
                  required_cases(root, children) for root, children in request_helper_cases.items()
              ))
              request_configuration_packages["request-configuration-helper-tests.jsonl"] = "github.com/openai/openai-cli/pkg/custom"
              if os.environ["RUNNER_OS"] == "Windows":
                  request_shell_root = "TestMainShellWindowsNative"
                  request_shell_cases = [
                      "placement_precedence_and_error", "root_and_body_project", "equals_empty",
                      "separate_empty", "completion_stays_local",
                  ]
                  request_shell_tests = {request_shell_root}
                  for shell in ["cmd", "powershell", "pwsh"]:
                      request_shell_tests.add(f"{request_shell_root}/{shell}")
                      request_shell_tests.update(required_cases(
                          f"{request_shell_root}/{shell}/request_configuration", request_shell_cases,
                      ))
                      request_shell_tests.update(
                          f"{request_shell_root}/{shell}/{case}" for case in [
                              "field_and_whole_request", "binary_input_and_literal_paths",
                              "downloads_and_managed_saves", "file_upload_receipt",
                          ]
                      )
                  request_shell_tests.update(
                      f"{request_shell_root}/console_cancellation/existing={existing}/event={event}"
                      for existing in ["false", "true"] for event in [0, 1]
                  )
                  request_shell_tests.update(
                      f"{request_shell_root}/stream_cancellation/{kind}"
                      for kind in ["responses", "transcriptions", "speech"]
                  )
                  suites["windows-native-shell-tests.jsonl"] = request_shell_tests
                  request_configuration_packages["windows-native-shell-tests.jsonl"] = "github.com/openai/openai-cli/cmd/openai"
                  windows_download_cases = {
                      "TestWindowsDownloadAutomaticConsole": [],
                      "TestWindowsDownloadPrivateCreation": [],
                      "TestWindowsDownloadPrivatePublication": ["hardlink", "exclusive_copy"],
                      "TestWindowsDownloadPreservesExistingDACL": ["complete", "source_failure"],
                  }
                  suites["windows-download-tests.jsonl"] = set().union(*(
                      required_cases(root, children) for root, children in windows_download_cases.items()
                  ))
                  request_configuration_packages["windows-download-tests.jsonl"] = "github.com/openai/openai-cli/pkg/custom"

          if os.environ["CHECK_ENVIRONMENT"] == "true":
              suites["environment-tests.jsonl"] = required_cases(
                  "TestRequestConfigurationRestoresEnvironment",
                  ["success", "setup_error", "action_error", "cancellation", "panic"],
              ) | required_cases(
                  "TestRequestConfigurationLeavesOtherEnvironmentCasesUnchanged",
                  ["valid_environment", "empty_environment", "unset_environment", "omitted_override", "empty_override"],
              )
          if os.environ["CHECK_GALLERY"] == "true":
              suites["gallery-tests.jsonl"] = required_cases(
                  "TestCleanupPreservesMalformedMetadata",
                  ["identity", "font", "allocation", "duplicate", "receipt", "unknown_field", "trailing_data"],
              ) | required_cases(
                  "TestCleanupResumesAfterPartialArtifactRemoval",
                  ["images", "fonts", "images_and_fonts"],
              )
          if os.environ["CHECK_PAGER"] == "true":
              suites["pager-tests.jsonl"] = required_cases(
                  "TestSocketPairPagerFailureKeepsReusedDescriptorOpen", ["LookPath", "ForkExec"],
              )
          if os.environ["CHECK_BASH_PREFIXES"] == "true":
              suites["bash-prefix-tests.jsonl"] = required_cases(
                  "TestBashColonCompletionReadline",
                  ["ordinary", "escaped", "single_quoted", "double_quoted", "partially_quoted",
                   "open_single_quote", "open_double_quote", "before_closing_quote", "colon_not_a_word_break",
                   "multiple_quoted_colons", "partially_escaped_colons", "first_colon_escaped"],
              )
          for filename, required in suites.items():
              passed = set()
              package_passed = False
              exact_events = Counter()
              invocation_symlink_events = Counter()
              invocation_symlink_names = set()
              welcome_runs = Counter()
              welcome_passes = Counter()
              welcome_package = Counter()
              welcome_names = set()
              request_configuration_events = Counter()
              with (Path(os.environ["RUNNER_TEMP"]) / filename).open() as events:
                  for line in events:
                      event = json.loads(line)
                      test = event.get("Test", "")
                      if filename == "windows-help-invocation-tests.jsonl":
                          if event["Action"] == "build-fail":
                              raise SystemExit(f"{filename}: unexpected build failure")
                          if event["Action"] == "build-output":
                              continue
                          if event.get("Package") != "github.com/openai/openai-cli/internal/clihelp":
                              continue
                          if test and not any(test == root or test.startswith(root + "/") for root in invocation_symlink_roots):
                              continue
                          if test:
                              invocation_symlink_names.add(test)
                          if event["Action"] in {"start", "run", "pass"}:
                              invocation_symlink_events[event["Action"], test] += 1
                      if filename in {"image-command-order-tests.jsonl", "fish-image-help-tests.jsonl", "fish-help-invocation-tests.jsonl"}:
                          if event["Action"] == "build-fail":
                              raise SystemExit(f"{filename}: unexpected build failure")
                          if event["Action"] == "build-output":
                              continue
                          if event.get("Package") != "github.com/openai/openai-cli/cmd/openai":
                              raise SystemExit(f"{filename}: unexpected package: {event.get('Package')}")
                          if event["Action"] in {"start", "run", "pass"}:
                              exact_events[event["Action"], test] += 1
                      if filename in request_configuration_packages:
                          if event["Action"] == "build-output":
                              continue
                          if event["Action"] == "build-fail":
                              raise SystemExit(f"{filename}: unexpected build failure")
                          if event.get("Package") != request_configuration_packages[filename]:
                              raise SystemExit(f"{filename}: unexpected package: {event.get('Package')}")
                          if event["Action"] in {"start", "run", "pass"}:
                              request_configuration_events[event["Action"], test] += 1
                      if filename == "dispatch-tests.jsonl" and test and test != completion_root and not test.startswith(completion_root + "/"):
                          continue
                      if event["Action"] in {"skip", "fail"}:
                          raise SystemExit(f"{filename}: unexpected {event['Action']}: {event.get('Test', 'package')}")
                      if filename == "welcome-public-tests.jsonl":
                          if event["Action"] == "build-fail":
                              raise SystemExit(f"{filename}: unexpected build failure")
                          if event["Action"] == "build-output":
                              continue
                          if event.get("Package") != "github.com/openai/openai-cli/cmd/openai":
                              raise SystemExit(f"{filename}: unexpected package: {event.get('Package')}")
                          if test:
                              welcome_names.add(test)
                              if event["Action"] == "run":
                                  welcome_runs[test] += 1
                              elif event["Action"] == "pass":
                                  welcome_passes[test] += 1
                          elif event["Action"] in {"start", "pass"}:
                              welcome_package[event["Action"]] += 1
                      if event["Action"] == "pass" and "Test" in event:
                          passed.add(event["Test"])
                      elif event["Action"] == "pass":
                          package_passed = True
              if filename == "welcome-public-tests.jsonl":
                  dynamic = set()
                  for name in welcome_names - required:
                      match = re.fullmatch(r"TestMainWelcomeBareInvocationStaysOffline/http://127\.0\.0\.1:([1-9][0-9]{0,4})", name)
                      if match and 1 <= int(match[1]) <= 65535:
                          dynamic.add(name)
                  if len(dynamic) != 1:
                      raise SystemExit(f"{filename}: expected one runtime loopback child, got {sorted(dynamic)}")
                  required = required | dynamic
                  expected_counts = Counter({name: 1 for name in required})
                  if (welcome_runs != expected_counts or welcome_passes != expected_counts or
                          welcome_names != required or welcome_package != Counter({"start": 1, "pass": 1})):
                      raise SystemExit(f"{filename}: missing, duplicate, or unexpected welcome events")
              missing = required - passed
              unexpected = passed - required if filename in {
                  "dispatch-tests.jsonl", "bash-prefix-tests.jsonl", "files-tests.jsonl", "image-tests.jsonl",
                  "image-command-order-tests.jsonl", "fish-image-help-tests.jsonl", "fish-help-invocation-tests.jsonl",
                  "windows-help-invocation-tests.jsonl",
                  "request-configuration-public-tests.jsonl", "request-configuration-helper-tests.jsonl",
                  "windows-native-shell-tests.jsonl", "windows-download-tests.jsonl",
                  "audio-tests.jsonl", "resource-tests.jsonl", "streaming-text-tests.jsonl",
                  "welcome-public-tests.jsonl",
                  "list-navigation-helper-tests.jsonl", "list-projection-helper-tests.jsonl", "list-renderer-helper-tests.jsonl",
              } else set()
              children = sum("/" in name for name in passed)
              if missing or unexpected or not package_passed:
                  raise SystemExit(f"{filename}: missing required tests: {sorted(missing)}; unexpected tests: {sorted(unexpected)}; package passed: {package_passed}")
              if filename == "windows-help-invocation-tests.jsonl":
                  expected_events = Counter({("start", ""): 1, ("pass", ""): 1})
                  expected_events.update({(action, test): 1 for action in ["run", "pass"] for test in required})
                  if invocation_symlink_events != expected_events or invocation_symlink_names != required:
                      raise SystemExit(f"{filename}: expected each test run/pass and package start/pass exactly once")
              if filename in request_configuration_packages:
                  expected_events = Counter({("start", ""): 1, ("pass", ""): 1})
                  expected_events.update({(action, test): 1 for action in ["run", "pass"] for test in required})
                  if request_configuration_events != expected_events:
                      raise SystemExit(f"{filename}: expected each test run/pass and package start/pass exactly once")
              if filename in {"image-command-order-tests.jsonl", "fish-image-help-tests.jsonl", "fish-help-invocation-tests.jsonl"}:
                  expected_events = Counter({("start", ""): 1, ("pass", ""): 1})
                  expected_events.update({(action, test): 1 for action in ["run", "pass"] for test in required})
                  if exact_events != expected_events:
                      raise SystemExit(f"{filename}: expected each test run/pass and package start/pass exactly once")
              print(f"{filename}: {len(passed) - children} roots and {children} children passed; no skips")
          PY

  wsl1-pager:
    needs: source
    permissions: {}
    name: Pager descriptor ownership on Ubuntu WSL 1
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Reserve WSL cleanup time
        shell: pwsh
        run: |
          $started = [DateTime]::UtcNow
          "WSL_PAGER_WORK_DEADLINE=$($started.AddMinutes(20).ToString('o'))" >> $env:GITHUB_ENV
          "WSL_PAGER_CLEANUP_DEADLINE=$($started.AddMinutes(23).ToString('o'))" >> $env:GITHUB_ENV
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 2
        with:
          go-version-file: .go-version
          check-latest: true
      - uses: ./.github/actions/link-go-sdk
      - name: Check the WSL pilot controls
        shell: pwsh
        timeout-minutes: 1
        run: python -I -B scripts/test_wsl_pager.py
      - name: Build the Linux compatibility test executables
        shell: pwsh
        timeout-minutes: 6
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2 -mod=readonly'
          GOTOOLCHAIN: local
        run: |
          $ErrorActionPreference = 'Stop'
          go test -c -o (Join-Path $env:RUNNER_TEMP 'wsl-pager.test') ./pkg/custom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o (Join-Path $env:RUNNER_TEMP 'wsl-process.test') ./cmd/openai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
          exit $LASTEXITCODE
      - name: Run compatibility checks in disposable Ubuntu WSL 1
        shell: pwsh
        timeout-minutes: 16
        run: python -I -B scripts/check-wsl-pager.py --binary (Join-Path $env:RUNNER_TEMP 'wsl-pager.test') --process-binary (Join-Path $env:RUNNER_TEMP 'wsl-process.test')
      - name: Reconcile the owned WSL distribution
        if: always()
        shell: pwsh
        timeout-minutes: 3
        run: python -I -B scripts/check-wsl-pager.py --cleanup
      - name: Retain WSL process evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsl-pager-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openai-cli-wsl1-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/openai-cli-wsl1-${{ github.run_id }}-${{ github.run_attempt }}/*.stdout
            ${{ runner.temp }}/openai-cli-wsl1-${{ github.run_id }}-${{ github.run_attempt }}/*.stderr
          if-no-files-found: warn
          retention-days: 7
