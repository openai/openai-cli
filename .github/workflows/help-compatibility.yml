                          if event["Action"] == "build-fail":
                              raise SystemExit(f"{filename}: unexpected build failure")
                          if event["Action"] == "build-output":
                              continue
                          if event.get("Package") != "github.com/openai/openai-cli/cmd/openai":
                              raise SystemExit(f"{filename}: unexpected package: {event.get('Package')}")
                          if test:
                              welcome_names.add(test)
                              if event["Action"] == "run":
                                  welcome_runs[test] += 1
                              elif event["Action"] == "pass":
                                  welcome_passes[test] += 1
                          elif event["Action"] in {"start", "pass"}:
                              welcome_package[event["Action"]] += 1
                      if event["Action"] == "pass" and "Test" in event:
                          passed.add(event["Test"])
                      elif event["Action"] == "pass":
                          package_passed = True
              if filename == "welcome-public-tests.jsonl":
                  dynamic = set()
                  for name in welcome_names - required:
                      match = re.fullmatch(r"TestMainWelcomeBareInvocationStaysOffline/http://127\.0\.0\.1:([1-9][0-9]{0,4})", name)
                      if match and 1 <= int(match[1]) <= 65535:
                          dynamic.add(name)
                  if len(dynamic) != 1:
                      raise SystemExit(f"{filename}: expected one runtime loopback child, got {sorted(dynamic)}")
                  required = required | dynamic
                  expected_counts = Counter({name: 1 for name in required})
                  if (welcome_runs != expected_counts or welcome_passes != expected_counts or
                          welcome_names != required or welcome_package != Counter({"start": 1, "pass": 1})):
                      raise SystemExit(f"{filename}: missing, duplicate, or unexpected welcome events")
              missing = required - passed
              unexpected = passed - required if filename in {
                  "dispatch-tests.jsonl", "bash-prefix-tests.jsonl", "files-tests.jsonl", "image-tests.jsonl",
                  "native-command-tests.jsonl",
                  "image-command-order-tests.jsonl", "fish-image-help-tests.jsonl", "fish-help-invocation-tests.jsonl",
                  "windows-help-invocation-tests.jsonl",
                  "image-save-process-tests.jsonl", "image-save-helper-tests.jsonl",
                  "request-configuration-public-tests.jsonl", "request-configuration-helper-tests.jsonl",
                  "windows-native-shell-tests.jsonl", "windows-download-tests.jsonl",
                  "audio-tests.jsonl", "resource-tests.jsonl", "streaming-text-tests.jsonl",
                  "image-model-discovery-tests.jsonl",
                  "welcome-public-tests.jsonl",
                  "list-navigation-helper-tests.jsonl", "list-projection-helper-tests.jsonl", "list-renderer-helper-tests.jsonl",
              } else set()
              children = sum("/" in name for name in passed)
              if missing or unexpected or not package_passed:
                  raise SystemExit(f"{filename}: missing required tests: {sorted(missing)}; unexpected tests: {sorted(unexpected)}; package passed: {package_passed}")
              if filename == "windows-help-invocation-tests.jsonl":
                  expected_events = Counter({("start", ""): 1, ("pass", ""): 1})
                  expected_events.update({(action, test): 1 for action in ["run", "pass"] for test in required})
                  if invocation_symlink_events != expected_events or invocation_symlink_names != required:
                      raise SystemExit(f"{filename}: expected each test run/pass and package start/pass exactly once")
              if filename in strict_packages:
                  expected_events = Counter({("start", ""): 1, ("pass", ""): 1})
                  expected_events.update({(action, test): 1 for action in ["run", "pass"] for test in required})
                  if strict_events != expected_events:
                      raise SystemExit(f"{filename}: expected each test run/pass and package start/pass exactly once")
              if filename in {"image-command-order-tests.jsonl", "fish-image-help-tests.jsonl", "fish-help-invocation-tests.jsonl"}:
                  expected_events = Counter({("start", ""): 1, ("pass", ""): 1})
                  expected_events.update({(action, test): 1 for action in ["run", "pass"] for test in required})
                  if exact_events != expected_events:
                      raise SystemExit(f"{filename}: expected each test run/pass and package start/pass exactly once")
              print(f"{filename}: {len(passed) - children} roots and {children} children passed; no skips")
          PY

      - name: Retain Windows voice validation evidence
        if: always() && matrix.native-commands && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-voice-validation-${{ matrix.goarch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-voice-public-tests.jsonl
            ${{ runner.temp }}/windows-voice-helper-tests.jsonl
          if-no-files-found: warn
          retention-days: 7

  picker-native-setup:
    if: github.event_name != 'push'
    needs: source
    permissions: {}
    name: Picker installation on native Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly'
      GOTOOLCHAIN: local
      OPENAI_CLI_PICKER_SETUP_CONTRACT: supported
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: ./.github/actions/setup-compatibility-go
      - name: Check fixture interruption and cleanup controls
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=5s 45s python3 -I -B scripts/test_wsl_shell_fixtures.py -v 2>&1 | tee "$RUNNER_TEMP/picker-fixture-controls.log"
      - name: Build native setup executables
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/picker-autocomplete.test" ./internal/autocomplete
          go test -c -o "$RUNNER_TEMP/picker-custom.test" ./internal/commands/images
          go test -c -o "$RUNNER_TEMP/picker-process.test" ./cmd/openai
          go build -o "$RUNNER_TEMP/picker-openai" ./cmd/openai
      - name: Require positive installation and native setup contracts
        shell: bash
        timeout-minutes: 4
        run: |
          python3 -I -B - <<'PY'
          import importlib.util, json, os, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("wsl_contracts", Path("scripts/check-wsl-pager.py"))
          checks = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checks)
          suites, _ = checks.load_local_cases()
          cases = {
              "autocomplete": suites["autocomplete"],
              "custom": {root: children for root, children in suites["custom"].items()
                         if root in {checks.NATIVE_CUSTOM_ROOT, "TestImagePickerShellSetupCapabilityErrors"}},
              "process": {root: children for root, children in suites["process"].items()
                          if root not in checks.INDEPENDENT_PROCESS_ROOTS},
          }
          for package, selected in cases.items():
              binary = Path(os.environ["RUNNER_TEMP"]) / ("picker-" + package + ".test")
              result = subprocess.run([str(binary), "-test.v", "-test.timeout=60s",
                                       "-test.run=^(" + "|".join(selected) + ")$"],
                                      stdin=subprocess.DEVNULL, capture_output=True, timeout=70)
              binary.with_suffix(".stdout").write_bytes(result.stdout)
              binary.with_suffix(".stderr").write_bytes(result.stderr)
              names = checks.require_test_pass(result.stdout, result.stderr, result.returncode,
                                               checks.test_names(selected), package)
              if package == "autocomplete":
                  checks.require_capability_receipt(result.stdout, "supported")
              print(json.dumps({"package": package, "contract": "supported", "tests": sorted(names)}))
          PY
      - name: Require positive Bash startup lifecycle
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=5s 120s python3 -I -B scripts/check-wsl-shell-startup.py "$RUNNER_TEMP/picker-openai" /usr/bin/bash login --setup-contract supported | tee "$RUNNER_TEMP/picker-startup-login.log"
          /usr/bin/timeout --signal=TERM --kill-after=5s 120s python3 -I -B scripts/check-wsl-shell-startup.py "$RUNNER_TEMP/picker-openai" /usr/bin/bash nonlogin --setup-contract supported | tee "$RUNNER_TEMP/picker-startup-nonlogin.log"
      - name: Retain native setup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-native-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/picker-*.stdout
            ${{ runner.temp }}/picker-*.stderr
            ${{ runner.temp }}/picker-startup-*.log
            ${{ runner.temp }}/picker-fixture-controls.log
          if-no-files-found: warn
          retention-days: 7

  # Fetch once on Linux instead of four slow Ubuntu-origin transfers on Windows.
  # Consumers recheck the pinned checksum; the artifact is only a transport.
  wsl-image:
    if: github.event_name != 'push'
    needs: source
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - name: Download and verify pinned Ubuntu image
        timeout-minutes: 8
        run: |
          python3 -I -B - <<'PYTHON'
          import importlib.util, os, sys, time
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("wsl_image", "scripts/check-wsl-pager.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.download_image(Path(os.environ["RUNNER_TEMP"]) / "ubuntu.wsl", time.monotonic() + 470)
          PYTHON
      - name: Stage verified Ubuntu image
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-ubuntu-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ubuntu.wsl
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Compile each package once, alongside image preparation. Consumers receive
  # source-bound, immutable bundles containing only their existing payloads.
  wsl-binaries:
    if: github.event_name != 'push'
    needs: source
    permissions: {}
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    outputs:
      wsl-pager: ${{ steps.pager.outputs.artifact-id }}
      wsl-command-contracts: ${{ steps.commands.outputs.artifact-id }}
      wsl-local-state: ${{ steps.local.outputs.artifact-id }}
      wsl-shell-contracts: ${{ steps.shell.outputs.artifact-id }}
      attempt: ${{ steps.build.outputs.attempt }}
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: ./.github/actions/setup-compatibility-go
        timeout-minutes: 2
        with:
          cache-compilation: 'true'
      - uses: ./.github/actions/link-go-sdk
      - name: Check WSL payload controls
        shell: pwsh
        timeout-minutes: 1
        run: python -I -B .github/scripts/test_wsl_payloads.py
      - name: Build and bind the Linux compatibility executables
        id: build
        shell: pwsh
        timeout-minutes: 6
        env:
          WSL_SOURCE_ARTIFACT_ID: ${{ needs.source.outputs.artifact-id }}
        run: python -I -B .github/scripts/wsl_payloads.py build (Join-Path $env:RUNNER_TEMP 'wsl-payloads')
      - name: Upload pager payloads
        id: pager
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: wsl-pager-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wsl-payloads/wsl-pager/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload command payloads
        id: commands
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: wsl-command-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wsl-payloads/wsl-command-contracts/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload local-state payloads
        id: local
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: wsl-local-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wsl-payloads/wsl-local-state/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload shell payloads
        id: shell
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: wsl-shell-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wsl-payloads/wsl-shell-contracts/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  wsl1-pager:
    if: github.event_name != 'push'
    needs: [source, wsl-image, wsl-binaries]
    permissions: {}
    name: ${{ matrix.name }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pager descriptor ownership on Ubuntu WSL 1
            arguments: ''
            artifact: wsl-pager
          - name: Command contracts on Ubuntu WSL 1
            arguments: --command-contracts
            artifact: wsl-command-contracts
          - name: Local state and offline commands on Ubuntu WSL 1
            arguments: --profile local-state --setup-contract refused
            profile: local-state
            artifact: wsl-local-state
          - name: Bash startup, first use and executable contracts on Ubuntu WSL 1
            arguments: --profile shell-contracts --setup-contract refused
            profile: shell-contracts
            artifact: wsl-shell-contracts
    steps:
      - name: Reserve WSL cleanup time
        shell: pwsh
        run: |
          $started = [DateTime]::UtcNow
          "WSL_PAGER_WORK_DEADLINE=$($started.AddMinutes(20).ToString('o'))" >> $env:GITHUB_ENV
          "WSL_PAGER_CLEANUP_DEADLINE=$($started.AddMinutes(23).ToString('o'))" >> $env:GITHUB_ENV
      - name: Download prepared source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - name: Check the WSL pilot controls
        shell: pwsh
        timeout-minutes: 1
        run: |
          python -I -B scripts/test_wsl_pager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/test_wsl_profiles.py
          exit $LASTEXITCODE
      - name: Download source-bound Linux payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 3
        with:
          artifact-ids: ${{ needs.wsl-binaries.outputs[matrix.artifact] }}
          path: ${{ runner.temp }}/wsl-payloads
          merge-multiple: true
      - name: Verify payload source and hashes
        shell: pwsh
        timeout-minutes: 1
        env:
          WSL_SOURCE_ARTIFACT_ID: ${{ needs.source.outputs.artifact-id }}
          WSL_PAYLOAD_ATTEMPT: ${{ needs.wsl-binaries.outputs.attempt }}
        run: python -I -B .github/scripts/wsl_payloads.py verify (Join-Path $env:RUNNER_TEMP 'wsl-payloads') --bundle '${{ matrix.artifact }}'
      - name: Download verified Ubuntu image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 3
        with:
          artifact-ids: ${{ needs.wsl-image.outputs.artifact-id }}
          path: ${{ runner.temp }}/wsl-image
          merge-multiple: true
      - name: Run compatibility checks in disposable Ubuntu WSL 1
        env:
          WSL_PAGER_IMAGE: ${{ runner.temp }}/wsl-image/ubuntu.wsl
        shell: pwsh
        timeout-minutes: 16
        run: |
          $payloadRoot = Join-Path $env:RUNNER_TEMP 'wsl-payloads'
          $payloads = @('--process-binary', (Join-Path $payloadRoot 'wsl-process.test'))
          if ('${{ matrix.arguments }}' -eq '--command-contracts') {
            $payloads += @('--app-binary', (Join-Path $payloadRoot 'wsl-pager.test'))
            $payloads += @('--images-binary', (Join-Path $payloadRoot 'wsl-images.test'))
          }
          if ('${{ matrix.profile }}' -ne 'shell-contracts') {
            $payloads += @('--binary', (Join-Path $payloadRoot 'wsl-pager.test'))
          }
          if ('${{ matrix.profile }}' -eq 'local-state') {
            $payloads += @('--imageprefs-binary', (Join-Path $payloadRoot 'wsl-imageprefs.test'))
            $payloads += @('--clihelp-binary', (Join-Path $payloadRoot 'wsl-clihelp.test'))
            $payloads += @('--autocomplete-binary', (Join-Path $payloadRoot 'wsl-autocomplete.test'))
          }
          if ('${{ matrix.profile }}' -eq 'shell-contracts') {
            $payloads += @('--autocomplete-binary', (Join-Path $payloadRoot 'wsl-autocomplete.test'))
            $payloads += @('--cli-binary', (Join-Path $payloadRoot 'wsl-openai'))
          }
          python -I -B scripts/check-wsl-pager.py @payloads ${{ matrix.arguments }}
          exit $LASTEXITCODE
      - name: Reconcile the owned WSL distribution
        if: always()
        shell: pwsh
        timeout-minutes: 3
        run: python -I -B scripts/check-wsl-pager.py --cleanup ${{ matrix.arguments }}
      - name: Retain WSL process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openai-cli-wsl1-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/openai-cli-wsl1-${{ github.run_id }}-${{ github.run_attempt }}/*.stdout
            ${{ runner.temp }}/openai-cli-wsl1-${{ github.run_id }}-${{ github.run_attempt }}/*.stderr
          if-no-files-found: warn
          retention-days: 7
