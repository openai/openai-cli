name: Help compatibility

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  source:
    uses: ./.github/workflows/prepare-ci-source.yml
    permissions:
      contents: read
      actions: read

  # Required native jobs only restore caches. Warm these platforms on main;
  # Windows x64 reuses the cache saved by existing CI jobs.
  warm-native-cache:
    if: github.event_name == 'push'
    needs: source
    permissions: {}
    name: Warm compatibility cache on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-11-arm]
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore main checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: ./.github/actions/setup-compatibility-go
        id: go-cache
        with:
          cache-compilation: 'true'
      - name: Warm native test and CLI compilation
        shell: bash
        env:
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          go test -p 1 ./cmd/openai ./internal/... -run '^$'
          go build -p 1 -o "$RUNNER_TEMP/openai.exe" ./cmd/openai
          go mod verify
      - name: Save native compatibility compilation
        if: steps.go-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build-cache }}
            ${{ steps.go-cache.outputs.module-cache }}
          key: ${{ steps.go-cache.outputs.cache-key }}

  help:
    if: github.event_name != 'push'
    needs: source
    permissions: {}
    name: ${{ matrix.shard == 'dispatch' && 'Help dispatch' || 'Help' }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            native-commands: true
            goos: darwin
            goarch: arm64
            runner-arch: ARM64
            shells: bash,zsh
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            runner-arch: X64
            shells: bash,zsh
            bash-prefixes: true
          - os: windows-latest
            image-state: true
            image-models: true
            native-commands: true
            image-order: true
            list-helpers: true
            goos: windows
            goarch: amd64
            runner-arch: X64
            shells: cmd,powershell,pwsh
            environment: true
          - os: macos-15-intel
            shard: contracts
            image-state: true
            image-models: true
            native-commands: true
            image-order: true
            welcome-public: true
            request-configuration: true
            list-helpers: true
            goos: darwin
            goarch: amd64
            runner-arch: X64
            shells: bash,zsh
            environment: true
            pager: true
            gallery: true
            bash-prefixes: true
          - os: ubuntu-24.04-arm
            image-state: true
            image-models: true
            native-commands: true
            image-order: true
            welcome-public: true
            list-helpers: true
            goos: linux
            goarch: arm64
            runner-arch: ARM64
            shells: bash,zsh
            environment: true
            pager: true
            bash-prefixes: true
          - os: windows-11-arm
            shard: contracts
            image-state: true
            image-models: true
            native-commands: true
            image-order: true
            welcome-public: true
            request-configuration: true
            list-helpers: true
            goos: windows
            goarch: arm64
            runner-arch: ARM64
            shells: cmd,powershell,pwsh
            environment: true
          # Separate subprocess-heavy dispatch from the remaining contracts on
          # the two slowest runners. Keep the other four platforms unsharded.
          - os: macos-15-intel
            shard: dispatch
            goos: darwin
            goarch: amd64
            runner-arch: X64
            shells: bash,zsh
          - os: windows-11-arm
            shard: dispatch
            goos: windows
            goarch: arm64
            runner-arch: ARM64
            shells: cmd,powershell,pwsh
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: ./.github/actions/setup-compatibility-go
        with:
          cache-compilation: ${{ matrix.os == 'macos-15-intel' || startsWith(matrix.os, 'windows-') }}
      - name: Verify native Go platform
        id: native-go-platform
        shell: bash
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS/$RUNNER_ARCH"
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$EXPECTED_GOOS/$EXPECTED_GOARCH"
          test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_GOOS/$EXPECTED_GOARCH"
      - name: Install Linux shells
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -r /etc/apt/sources.list.d/ubuntu.sources
          ubuntu_sources=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=/dev/null
          )
          cat /etc/apt/sources.list.d/ubuntu.sources
          if test -r /etc/apt/apt-mirrors.txt; then
            cat /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get "${ubuntu_sources[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${ubuntu_sources[@]}" install --yes --no-install-recommends zsh fish expect
          apt-cache "${ubuntu_sources[@]}" policy zsh fish expect
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' zsh fish expect
          for tool in zsh fish expect; do
            test "$(dpkg-query -W -f='${Architecture}' "$tool")" = "$(dpkg --print-architecture)"
            executable=$(command -v "$tool")
            printf '%s executable: %s\n' "$tool" "$executable"
            package_files=$(dpkg-query -L "$tool")
            package_path=
            while IFS= read -r candidate_path; do
              if test -f "$candidate_path" && test "$executable" -ef "$candidate_path"; then
                package_path=$candidate_path
                break
              fi
            done <<< "$package_files"
            test -n "$package_path"
            printf '%s package executable: %s\n' "$tool" "$package_path"
          done
          zsh --version
          fish --version
          expect -v
      - uses: ./.github/actions/link-go-sdk
        id: link-go-sdk
      - name: Test native portable command contracts
        if: matrix.native-commands && runner.os != 'Windows' && matrix.shard != 'dispatch'
        shell: bash
        timeout-minutes: 10
        env:
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          go test -p 1 ./cmd/openai -count=1 -timeout=5m -v -json -run '^(TestMainAPIErrorsFormatPrecedenceAndExtraction|TestMainAPIErrorsPreserveJSONDetailsAndExtraction|TestMainAPIErrorsStructuredAcrossCommands|TestMainAPIErrorsWithUnexpectedJSONShapes|TestMainAPIErrorsWithoutJSONDetails|TestMainCommandGroupsHaveWorkflowDescriptions|TestMainCommandSubgroupsCoverGeneratedRoutes|TestMainCommandSubgroupsHelpAndCompletion|TestMainCommandSubgroupsLegacyPrefixCompletion|TestMainCommandSubgroupsPreserveAudioAndErrors|TestMainCommandSubgroupsPreserveBodyFlagScope|TestMainCommandSubgroupsPreserveRequestsAndOutput|TestMainCommandSubgroupsStreamingStaysIncremental|TestMainLocalErrorGuidance|TestMainLocalErrorsStayOnStderr|TestMainNestedHelpErrorFormatPrecedence|TestMainPreservesWrappedExitCode|TestMainReadableAPIArgumentGuidance|TestMainReadableDefaultAndExplicitText|TestMainReadableErrorsStayOnStderr|TestMainReadablePreservesExplicitFormatsAndExtraction|TestMainReadableRawOutputStreamsBeforeNextEvent|TestMainSensitiveLocalErrors|TestMainStreamErrorsPreserveEventDetails|TestMainTaskAdminRoutesPreserveCredentialAndFlagScope|TestMainTaskAudioUploadsPreserveRequestsAndOutput|TestMainTaskFileUploadPreservesMultipartAndOutput|TestMainTaskResourceRoutesPreserveAPIErrorsAndExit|TestMainTaskRouteCompletionProtocols|TestMainTaskRouteHelpStaysLocal|TestMainTaskRoutesPreserveAPIErrorsAndExit|TestMainTaskRoutesPreserveRequiredFlags|TestMainTaskSpeechPreservesJSONInputAndBinaryOutput|TestMainTaskWindowsAudioInterruptClosesStreams)$' \
            | tee "$RUNNER_TEMP/native-command-tests.jsonl"
      - name: Test Windows portable command and alias cancellation contracts
        if: matrix.native-commands && runner.os == 'Windows' && matrix.shard != 'dispatch'
        shell: pwsh
        timeout-minutes: 10
        env:
          GOMAXPROCS: '2'
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 1 ./cmd/openai -count=1 -timeout=5m -v -json -run '^(TestMainAPIErrorsFormatPrecedenceAndExtraction|TestMainAPIErrorsPreserveJSONDetailsAndExtraction|TestMainAPIErrorsStructuredAcrossCommands|TestMainAPIErrorsWithUnexpectedJSONShapes|TestMainAPIErrorsWithoutJSONDetails|TestMainCommandGroupsHaveWorkflowDescriptions|TestMainCommandSubgroupsCoverGeneratedRoutes|TestMainCommandSubgroupsHelpAndCompletion|TestMainCommandSubgroupsLegacyPrefixCompletion|TestMainCommandSubgroupsPreserveAudioAndErrors|TestMainCommandSubgroupsPreserveBodyFlagScope|TestMainCommandSubgroupsPreserveRequestsAndOutput|TestMainCommandSubgroupsStreamingStaysIncremental|TestMainLocalErrorGuidance|TestMainLocalErrorsStayOnStderr|TestMainNestedHelpErrorFormatPrecedence|TestMainPreservesWrappedExitCode|TestMainReadableAPIArgumentGuidance|TestMainReadableDefaultAndExplicitText|TestMainReadableErrorsStayOnStderr|TestMainReadablePreservesExplicitFormatsAndExtraction|TestMainReadableRawOutputStreamsBeforeNextEvent|TestMainSensitiveLocalErrors|TestMainStreamErrorsPreserveEventDetails|TestMainTaskAdminRoutesPreserveCredentialAndFlagScope|TestMainTaskAudioUploadsPreserveRequestsAndOutput|TestMainTaskFileUploadPreservesMultipartAndOutput|TestMainTaskResourceRoutesPreserveAPIErrorsAndExit|TestMainTaskRouteCompletionProtocols|TestMainTaskRouteHelpStaysLocal|TestMainTaskRoutesPreserveAPIErrorsAndExit|TestMainTaskRoutesPreserveRequiredFlags|TestMainTaskSpeechPreservesJSONInputAndBinaryOutput|TestMainTaskWindowsAudioInterruptClosesStreams)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'native-command-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Windows voice validation and upload ownership
        if: (matrix.native-commands && runner.os == 'Windows') && matrix.shard != 'dispatch'
        shell: pwsh
        timeout-minutes: 10
        env:
          GOMAXPROCS: '2'
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 1 ./cmd/openai -count=1 -timeout=5m -v -json -run '^(TestMainAudioVoiceDiscriminatorReferences|TestMainAudioVoiceMergedInputs|TestMainAudioVoicePreflight|TestMainAudioVoiceReferenceOrdering)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-voice-public-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -p 1 ./internal/commands/audio -count=1 -timeout=2m -v -json -run '^(TestAudioVoiceBodyEmbeddingCancellationReleasesOwnedRead|TestAudioVoiceBodyEmbeddingPartialFailureClosesOnce|TestAudioVoiceBodyEmbeddingPreservesReplayAndOwnership|TestAudioVoiceBodyEmbeddingReadFailureRetainsCauses|TestAudioVoiceBodyEmbeddingTypeOpenFailureClosesOwnedInputs|TestAudioVoiceBodyEmbeddingValidationFailureClosesOwnedInputs)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-voice-helper-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test help
        if: runner.os != 'Windows' && matrix.shard != 'dispatch'
        run: go test ./internal/clihelp ./internal/requestflag -count=1 -v
      - name: Test Windows help
        if: runner.os == 'Windows' && matrix.shard != 'dispatch'
        shell: pwsh
        env:
          OPENAI_CLI_REQUIRE_WINDOWS_SYMLINKS: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/clihelp ./internal/requestflag -count=1 -v -json |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-help-invocation-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test public welcome startup
        if: matrix.welcome-public && runner.os != 'Windows' && matrix.shard != 'dispatch'
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 ./cmd/openai -count=1 -timeout=2m -v -json \
            -run '^(TestMainDispatchEmptyArguments|TestMainWelcomeExplicitArgumentsStayPlain|TestMainWelcomeBareInvocationStaysOffline)$' \
            | tee "$RUNNER_TEMP/welcome-public-tests.jsonl"
      - name: Test Windows public welcome startup
        if: matrix.welcome-public && runner.os == 'Windows' && matrix.shard != 'dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=2m -v -json -run '^(TestMainDispatchEmptyArguments|TestMainWelcomeExplicitArgumentsStayPlain|TestMainWelcomeBareInvocationStaysOffline)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'welcome-public-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      # The exhaustive command/flag inventory remains in CI's full Linux
      # suite. Native help routes, flag placement and shell behavior stay here.
      - name: Test command dispatch and native shells
        if: runner.os != 'Windows' && matrix.shard != 'contracts'
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/openai -run '^(TestMainHelp|TestMainDispatch|TestMainNativeShell)' -skip '^TestMainHelpFullReferencePreservesEveryFlag$' -count=1 -v -json \
            | tee "$RUNNER_TEMP/dispatch-tests.jsonl"
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: ${{ matrix.shells }}
      - name: Test Windows command dispatch and native shells
        if: runner.os == 'Windows' && matrix.shard != 'contracts'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./cmd/openai -run '^(TestMainHelp|TestMainDispatch|TestMainNativeShell)' -skip '^TestMainHelpFullReferencePreservesEveryFlag$' -count=1 -v -json |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'dispatch-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: ${{ matrix.shells }}
      - name: Test Windows tokenizer console reader and preview worker
        if: runner.os == 'Windows' && matrix.shard != 'dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./internal/commands/tokenize -count=1 -timeout=2m -v -json -run '^TestTokenizer(ConsoleInput|InputSourcePreservesNonConsoleBytes|Preview(MatchesExactEncodings|CancellationDuringChildWork|PreservesDeadline|LegacyCancellationDuringNumericWork))' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'tokenizer-reader-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test image command ordering
        if: matrix.image-order && runner.os != 'Windows' && matrix.shard != 'dispatch'
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json \
            -run '^(TestMainImageCommandHelpOrder|TestMainImageCommandCompletionOrder)$' \
            | tee "$RUNNER_TEMP/image-command-order-tests.jsonl"
      - name: Test Windows image command ordering
        if: matrix.image-order && runner.os == 'Windows' && matrix.shard != 'dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^(TestMainImageCommandHelpOrder|TestMainImageCommandCompletionOrder)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'image-command-order-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Linux Fish help invocation
        if: runner.os == 'Linux' && matrix.shard != 'dispatch'
        shell: bash
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: fish
        run: |
          set -euo pipefail
          go test ./cmd/openai -count=1 -timeout=3m -v -json \
            -run '^TestMainFishHelpInvocation$' \
            | tee "$RUNNER_TEMP/fish-help-invocation-tests.jsonl"
      - name: Test Linux Fish image help examples
        if: runner.os == 'Linux' && matrix.shard != 'dispatch'
        shell: bash
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: fish
        run: |
          set -euo pipefail
          go test ./cmd/openai -count=1 -timeout=3m -v -json \
            -run '^TestMainFishImageHelpExamples$' \
            | tee "$RUNNER_TEMP/fish-image-help-tests.jsonl"
      - name: Test Linux Fish completion
        if: runner.os == 'Linux' && matrix.shard != 'dispatch'
        shell: bash
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: fish
        run: |
          set -euo pipefail
          fish_version=$(fish --no-config -c 'printf "%s\n" $version')
          if [[ ! $fish_version =~ ^([0-9]+)\.[0-9]+\.[0-9]+([-.+][[:alnum:].+-]+)?$ ]]; then
            printf 'Unexpected Fish version: %s\n' "$fish_version" >&2
            exit 1
          fi
          fish_major=${BASH_REMATCH[1]}
          if (( 10#$fish_major >= 4 )); then
            fish_suggestions=supported
            suggestion_pattern='TestShellSuggestionsFish.*'
          else
            fish_suggestions=unsupported
            suggestion_pattern='TestShellSuggestionsFish(RefusesUnsupportedVersionBeforeMutation|NoninteractiveDoesNotActivate)'
            printf '%s\n' 'Fish executable suggestions: native refusal coverage only; Fish 4+ behavior requires a supported host.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'Fish %s: executable suggestion mode %s\n' "$fish_version" "$fish_suggestions"
          printf 'OPENAI_CLI_CI_FISH_VERSION=%s\nOPENAI_CLI_CI_FISH_SUGGESTIONS=%s\n' "$fish_version" "$fish_suggestions" >> "$GITHUB_ENV"
          go test ./internal/autocomplete -count=1 -timeout=5m -v -json \
            -run "^(TestFish(FileCompletionPreservesAssignments|PackagePickerFirstPrompt|PackagePreservesOrdinaryCompletions)|TestPickerFish(TabAndLifecycle|BindingsAndResourcing|RejectsOtherCommandLines)|TestPickerInstalledFish(HonorsSharedOptOut|RunsAfterUserConfiguration)|${suggestion_pattern})$" \
            | tee "$RUNNER_TEMP/fish-tests.jsonl"
      - name: Test Linux executable suggestion adapters
        if: (runner.os == 'Linux' && env.OPENAI_CLI_CI_FISH_SUGGESTIONS == 'supported') && matrix.shard != 'dispatch'
        shell: bash
        timeout-minutes: 4
        env:
          GOMAXPROCS: '2'
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: fish
        run: |
          set -euo pipefail
          go test -p 1 ./internal/autocomplete -count=1 -timeout=3m -v -json \
            -run '^(TestShellSuggestionsAdaptersUnavailableExecutable|TestShellSuggestionsAdaptersRefuseShadowedExecutable|TestShellSuggestionsAdaptersRecheckExecutablePrecedence|TestShellSuggestionsAdaptersRecheckRemovedExecutable)$/^fish$' \
            | tee "$RUNNER_TEMP/fish-suggestion-adapter-tests.jsonl"
      - name: Test Linux Bash and zsh executable suggestions
        if: (runner.os == 'Linux') && matrix.shard != 'dispatch'
        shell: bash
        timeout-minutes: 4
        env:
          GOMAXPROCS: '2'
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: bash,zsh
          OPENAI_CLI_TEST_BASH: /bin/bash
        run: |
          set -euo pipefail
          go test -p 1 ./internal/autocomplete -count=1 -timeout=3m -v -json \
            -run '^(TestShellSuggestionMatcherCoversEverySingleEdit|TestShellSuggestionMatcherUsesBoundName|TestShellSuggestionScriptsResolveOnlyRendererTokens|TestShellSuggestionsBashDisableAndReenablePreservesTracing|TestShellSuggestionsBashNocasematchPreservesCaseOnlyReplacement|TestShellSuggestionsBashNocasematchPreservesExactMatchingAndOptions|TestShellSuggestionsBashNocasematchRejectsCaseOnlyBindingChange|TestShellSuggestionsBashRefusalPreservesExtglobOptions|TestShellSuggestionsBashRefusalPreservesParsedAliases|TestShellSuggestionsBashRefusalPreservesSourceProvenanceAndSiblingFiles|TestShellSuggestionsBashRefusalPreservesTracingPrivacy|TestShellSuggestionsBashRefusesExportedOrReadonlyHandler|TestShellSuggestionsBashRefusesPriorHandlerWithoutChangingNativeIdentity|TestShellSuggestionsBashRejectsForeignHandlerAfterDisable|TestShellSuggestionsBashZshAdvisoryAndPrivacy|TestShellSuggestionsBashZshFallbackDoesNotEchoCommandText|TestShellSuggestionsBashZshPreserveLaterReplacement|TestShellSuggestionsBashZshPreservePriorErrexit|TestShellSuggestionsBashZshPriorExitPrecedesAdvice|TestShellSuggestionsBashZshRefuseShadowedExecutable|TestShellSuggestionsBashZshRejectRebindingUntilDisabled|TestShellSuggestionsBashZshRejectRemovedCachedExecutable|TestShellSuggestionsRequireSafeBoundName|TestShellSuggestionsZshDisableAndReenablePreservesTracing|TestShellSuggestionsZshRefusalPreservesHandlerAttributes|TestShellSuggestionsZshRefusalPreservesTracingPrivacy|TestShellSuggestionsZshRefusesAutoloadWithoutLoadingHandler|TestShellSuggestionsZshRefusesEmptyPriorHandler|TestShellSuggestionsZshRefusesPriorHandlerWithoutChangingNativeIdentity|TestShellSuggestionsZshRejectsForeignHandlerAfterDisable|TestShellSuggestionsZshRejectsMissingAutoloadWithoutPartialActivation)$' \
            | tee "$RUNNER_TEMP/bash-zsh-suggestion-tests.jsonl"
      - name: Test Linux public executable suggestion setup
        if: (runner.os == 'Linux') && matrix.shard != 'dispatch'
        shell: bash
        timeout-minutes: 4
        env:
          GOMAXPROCS: '2'
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: bash,zsh,fish
          OPENAI_CLI_TEST_BASH: /bin/bash
        run: |
          set -euo pipefail
          shells='bash|zsh'
          if test "$OPENAI_CLI_CI_FISH_SUGGESTIONS" = supported; then
            shells+='|fish'
          fi
          go test -p 1 ./cmd/openai -count=1 -timeout=3m -v -json \
            -run "^TestMainShellSuggestionsNative$/^(${shells})$" \
            | tee "$RUNNER_TEMP/public-shell-suggestion-tests.jsonl"
      - name: Test Linux native command quoting
        if: runner.os == 'Linux' && matrix.shard != 'dispatch'
        shell: bash
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: zsh,fish
        run: |
          set -euo pipefail
          go test ./internal/terminal -count=1 -timeout=2m -v -json \
            -run '^TestImagePickerNativeShellQuoting/(zsh|fish)$' \
            | tee "$RUNNER_TEMP/shell-quoting-tests.jsonl"
      - name: Test Windows Files upload and download routes
        if: runner.os == 'Windows' && matrix.shard != 'dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^TestMainFilesWorkflow(UploadPaths|UploadValidation|UploadStdinCompatibility|ExplicitBinaryStdin|MachineOutput|DownloadBytes|DownloadReceiptModes|FailuresPreserveExits)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'files-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Windows image uploads and saved results
        if: runner.os == 'Windows' && matrix.shard != 'dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^(TestMainImageUploadQuotedCountPreservesMultipart|TestMainImageEditQuotedStreamScalars|TestMainImageUploadMalformedScalarTextFailsBeforeRequest|TestMainImageUploadNullAndScalarLookingStringsKeepMultipartValues|TestMainImageEditStreamSavesFinalAndCloses|TestMainImageUploadBatchCollisionAndPartialFailure|TestMainImageGenerationStreamSavesOnlyFinalAndClosesResponse|TestMainImageGenerationPartialFailureKeepsSavedImage|TestMainImageGenerationClosedStdoutKeepsSavedImage|TestImageReceiptProcessRejectsNonPipeStdout)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'image-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test image model discovery
        if: matrix.image-models && runner.os != 'Windows' && matrix.shard != 'dispatch'
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^TestMainImageModels' \
            | tee "$RUNNER_TEMP/image-model-discovery-tests.jsonl"
      - name: Test Windows image model discovery
        if: matrix.image-models && runner.os == 'Windows' && matrix.shard != 'dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^TestMainImageModels' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'image-model-discovery-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Windows image save boundaries and interruption
        if: runner.os == 'Windows' && matrix.shard != 'dispatch'
