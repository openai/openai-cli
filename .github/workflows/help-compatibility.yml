name: Help compatibility

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  source:
    uses: ./.github/workflows/prepare-ci-source.yml
    permissions:
      contents: read
      actions: read

  help:
    needs: source
    permissions: {}
    name: Help on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            runner-arch: ARM64
            shells: bash,zsh
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            runner-arch: X64
            shells: bash,zsh
            bash-prefixes: true
          - os: windows-latest
            image-order: true
            list-helpers: true
            goos: windows
            goarch: amd64
            runner-arch: X64
            shells: cmd,powershell,pwsh
            environment: true
          - os: macos-15-intel
            image-order: true
            welcome-public: true
            request-configuration: true
            list-helpers: true
            goos: darwin
            goarch: amd64
            runner-arch: X64
            shells: bash,zsh
            environment: true
            pager: true
            gallery: true
            bash-prefixes: true
          - os: ubuntu-24.04-arm
            image-order: true
            welcome-public: true
            list-helpers: true
            goos: linux
            goarch: arm64
            runner-arch: ARM64
            shells: bash,zsh
            environment: true
            pager: true
            bash-prefixes: true
          - os: windows-11-arm
            image-order: true
            welcome-public: true
            request-configuration: true
            list-helpers: true
            goos: windows
            goarch: arm64
            runner-arch: ARM64
            shells: cmd,powershell,pwsh
            environment: true
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - name: Verify native Go platform
        shell: bash
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS/$RUNNER_ARCH"
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$EXPECTED_GOOS/$EXPECTED_GOARCH"
          test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_GOOS/$EXPECTED_GOARCH"
      - name: Install Linux shells
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -r /etc/apt/sources.list.d/ubuntu.sources
          ubuntu_sources=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=/dev/null
          )
          cat /etc/apt/sources.list.d/ubuntu.sources
          if test -r /etc/apt/apt-mirrors.txt; then
            cat /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get "${ubuntu_sources[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${ubuntu_sources[@]}" install --yes --no-install-recommends zsh fish expect
          apt-cache "${ubuntu_sources[@]}" policy zsh fish expect
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' zsh fish expect
          for tool in zsh fish expect; do
            test "$(dpkg-query -W -f='${Architecture}' "$tool")" = "$(dpkg --print-architecture)"
            executable=$(command -v "$tool")
            printf '%s executable: %s\n' "$tool" "$executable"
            package_files=$(dpkg-query -L "$tool")
            package_path=
            while IFS= read -r candidate_path; do
              if test -f "$candidate_path" && test "$executable" -ef "$candidate_path"; then
                package_path=$candidate_path
                break
              fi
            done <<< "$package_files"
            test -n "$package_path"
            printf '%s package executable: %s\n' "$tool" "$package_path"
          done
          zsh --version
          fish --version
          expect -v
      - uses: ./.github/actions/link-go-sdk
      - name: Test help
        if: runner.os != 'Windows'
        run: go test ./internal/clihelp ./internal/requestflag -count=1 -v
      - name: Test Windows help
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENAI_CLI_REQUIRE_WINDOWS_SYMLINKS: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/clihelp ./internal/requestflag -count=1 -v -json |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-help-invocation-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test public welcome startup
        if: matrix.welcome-public && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 ./cmd/openai -count=1 -timeout=2m -v -json \
            -run '^(TestMainWelcomeRedirectedOutputMatchesHelp|TestMainWelcomeExplicitArgumentsStayPlain|TestMainWelcomeBareInvocationStaysOffline)$' \
            | tee "$RUNNER_TEMP/welcome-public-tests.jsonl"
      - name: Test Windows public welcome startup
        if: matrix.welcome-public && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=2m -v -json -run '^(TestMainWelcomeRedirectedOutputMatchesHelp|TestMainWelcomeExplicitArgumentsStayPlain|TestMainWelcomeBareInvocationStaysOffline)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'welcome-public-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test command dispatch and native shells
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/openai -run '^(TestMainHelp|TestMainDispatch|TestMainNativeShell)' -count=1 -v -json \
            | tee "$RUNNER_TEMP/dispatch-tests.jsonl"
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: ${{ matrix.shells }}
      - name: Test Windows command dispatch and native shells
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./cmd/openai -run '^(TestMainHelp|TestMainDispatch|TestMainNativeShell)' -count=1 -v -json |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'dispatch-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: ${{ matrix.shells }}
      - name: Test Windows tokenizer console reader
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./pkg/custom -count=1 -timeout=2m -v -json -run '^TestTokenizer(ConsoleInput|InputSourcePreservesNonConsoleBytes)' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'tokenizer-reader-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test image command ordering
        if: matrix.image-order && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json \
            -run '^(TestMainImageCommandHelpOrder|TestMainImageCommandCompletionOrder)$' \
            | tee "$RUNNER_TEMP/image-command-order-tests.jsonl"
      - name: Test Windows image command ordering
        if: matrix.image-order && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^(TestMainImageCommandHelpOrder|TestMainImageCommandCompletionOrder)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'image-command-order-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Linux Fish help invocation
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: fish
        run: |
          set -euo pipefail
          go test ./cmd/openai -count=1 -timeout=3m -v -json \
            -run '^TestMainFishHelpInvocation$' \
            | tee "$RUNNER_TEMP/fish-help-invocation-tests.jsonl"
      - name: Test Linux Fish image help examples
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: fish
        run: |
          set -euo pipefail
          go test ./cmd/openai -count=1 -timeout=3m -v -json \
            -run '^TestMainFishImageHelpExamples$' \
            | tee "$RUNNER_TEMP/fish-image-help-tests.jsonl"
      - name: Test Linux Fish completion
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: fish
        run: |
          set -euo pipefail
          go test ./internal/autocomplete -count=1 -timeout=5m -v -json \
            -run '^(TestFish(FileCompletionPreservesAssignments|PackagePickerFirstPrompt|PackagePreservesOrdinaryCompletions)|TestPickerFish(TabAndLifecycle|BindingsAndResourcing|RejectsOtherCommandLines)|TestPickerInstalledFish(HonorsSharedOptOut|RunsAfterUserConfiguration))$' \
            | tee "$RUNNER_TEMP/fish-tests.jsonl"
      - name: Test Linux native command quoting
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: zsh,fish
        run: |
          set -euo pipefail
          go test ./pkg/custom -count=1 -timeout=2m -v -json \
            -run '^TestImagePickerNativeShellQuoting/(zsh|fish)$' \
            | tee "$RUNNER_TEMP/shell-quoting-tests.jsonl"
      - name: Test Windows Files upload and download routes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^TestMainFilesWorkflow(UploadPaths|UploadValidation|UploadStdinCompatibility|ExplicitBinaryStdin|MachineOutput|DownloadBytes|DownloadReceiptModes|FailuresPreserveExits)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'files-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Windows image uploads and saved results
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^(TestMainImageUploadQuotedCountPreservesMultipart|TestMainImageEditQuotedStreamScalars|TestMainImageUploadMalformedScalarTextFailsBeforeRequest|TestMainImageUploadNullAndScalarLookingStringsKeepMultipartValues|TestMainImageEditStreamSavesFinalAndCloses|TestMainImageUploadBatchCollisionAndPartialFailure|TestMainImageGenerationStreamSavesOnlyFinalAndClosesResponse|TestMainImageGenerationPartialFailureKeepsSavedImage|TestMainImageGenerationClosedStdoutKeepsSavedImage|TestImageReceiptProcessRejectsNonPipeStdout)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'image-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Windows audio output behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^(TestMainReadableAudioJSONPreservesTextAndMetadata|TestMainReadableAudioTextAndSubtitles|TestMainReadableAudioTranscriptionStreamsBeforeDone|TestMainReadableAudioTranscriptionKeepsEventsAndMetadata|TestMainReadableAudioStreamFailuresKeepPartialOutput|TestMainReadableAudioSpeechFormatsAndDownloads|TestMainReadableAudioSpeechPreservesBinary|TestMainReadableAudioLargePayloads)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'audio-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Windows resource output and pagination
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^(TestMainResourceSummariesRetainActionFields|TestMainResourceSummaryListFilesInVectorBatch|TestMainResourceSummaryPaginationPreservesOrderDuplicatesAndLimits|TestMainResourceSummaryListNoticeForMixedRecords|TestMainResourceSummaryEmptyList|TestMainResourceSummaryUnknownFieldsAndShapesFallBack|TestMainResourceSummaryExplicitFormatsAndExtractionKeepFullData|TestMainResourceSummaryListFormatsAndExtractionKeepFullItems|TestMainResourceSummaryLeavesOtherOperationsUnchanged|TestMainResourceSummaryPreservesLargeActionArguments|TestMainResourceSummaryPreservesPartialPageOnFailure|TestMainResourceSummaryWritesBeforeNextPageArrives|TestMainListNavigationNoninteractive)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'resource-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Windows streaming text output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^(TestMainStreamingTextArrivesBeforeCompletion|TestMainStreamingTextKeepsPartIdentityAndSnapshots|TestMainStreamingTextRetainsNontextDetails|TestMainStreamingExplicitFormatsPreserveEveryEvent|TestMainStreamingTextInterleavedChoicesKeepDetails|TestMainStreamingFailuresPreservePartialOutput|TestMainStreamingInterruptedTransportPreservesPartialOutput|TestMainStreamingFailureDiagnostics|TestMainStreamingTextDistinguishesEarlyEOFAndEmptyCompletion|TestMainStreamingTextLargeEvent)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'streaming-text-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test list navigation and table helpers
        if: matrix.list-helpers && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 ./pkg/custom -count=1 -timeout=2m -v -json -run '^(TestListPageFetcherWaitsAndPreservesPageSize|TestShowJSONPagesZeroRetainsRequestErrors|TestListPageFetcherStopsEmptyAndStalledCursors|TestListPageFetcherCancellationPreventsRequests|TestListNavigationUsesLoadedRowsBeforeOneRequest|TestListNavigationOutputPreservesFailureAndRestoresModes|TestListNavigationOutputFailureDiagnostic|TestListNavigationQuitRetainsRealFailures|TestListNavigationLargeFieldPreservedAndPrewrapped|TestListNavigationPrintPageCancelsWithoutFetching|TestListNavigationLabelsPreserveLongIDs|TestListNavigationNarrowFooterKeepsQuitAndPrintVisible|TestListNavigationErrorPresentation|TestListNavigationCompleteFirstPageFitsScreen|TestListNavigationContentFitsDisplayCells|TestListNavigationShortResultPreservesErrorsAndHistory|TestRenderListNavigationPageHintPolicy|TestRenderListNavigationPageCancelsProjection|TestRenderListTablePage|TestRenderListTablePageEmptyAndUnsupported)$' \
            | tee "$RUNNER_TEMP/list-navigation-helper-tests.jsonl"
          go test -p 2 ./pkg/transformers -count=1 -timeout=2m -v -json -run '^(TestProjectListTableCanceledContext|TestListTableCountsCancellation|TestProjectListTableKnownResources|TestProjectListTableMissingOptionalFields|TestProjectListTableEmptyPagesAndRoutes|TestProjectListTablePreservesOriginalStrings|TestProjectListTableFallsBackForEntirePage|TestProjectListTablePreservesErrorsAndMalformedFields|TestProjectListTableByteSizes)$' \
            | tee "$RUNNER_TEMP/list-projection-helper-tests.jsonl"
          go test -p 2 ./internal/readable -count=1 -timeout=2m -v -json -run '^(TestListTableKeepsIDsAndFitsWidth|TestListTableNarrowFallbackKeepsIDs|TestListTableEscapesEveryCell|TestListTableUnicodeWidths|TestListTableEmptyAndMalformedRows)$' \
            | tee "$RUNNER_TEMP/list-renderer-helper-tests.jsonl"
      - name: Test Windows list navigation and table helpers
        if: matrix.list-helpers && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./pkg/custom -count=1 -timeout=2m -v -json -run '^(TestListPageFetcherWaitsAndPreservesPageSize|TestShowJSONPagesZeroRetainsRequestErrors|TestListPageFetcherStopsEmptyAndStalledCursors|TestListPageFetcherCancellationPreventsRequests|TestListNavigationUsesLoadedRowsBeforeOneRequest|TestListNavigationOutputPreservesFailureAndRestoresModes|TestListNavigationOutputFailureDiagnostic|TestListNavigationQuitRetainsRealFailures|TestListNavigationLargeFieldPreservedAndPrewrapped|TestListNavigationPrintPageCancelsWithoutFetching|TestListNavigationLabelsPreserveLongIDs|TestListNavigationNarrowFooterKeepsQuitAndPrintVisible|TestListNavigationErrorPresentation|TestListNavigationCompleteFirstPageFitsScreen|TestListNavigationContentFitsDisplayCells|TestListNavigationShortResultPreservesErrorsAndHistory|TestRenderListNavigationPageHintPolicy|TestRenderListNavigationPageCancelsProjection|TestRenderListTablePage|TestRenderListTablePageEmptyAndUnsupported)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'list-navigation-helper-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -p 2 ./pkg/transformers -count=1 -timeout=2m -v -json -run '^(TestProjectListTableCanceledContext|TestListTableCountsCancellation|TestProjectListTableKnownResources|TestProjectListTableMissingOptionalFields|TestProjectListTableEmptyPagesAndRoutes|TestProjectListTablePreservesOriginalStrings|TestProjectListTableFallsBackForEntirePage|TestProjectListTablePreservesErrorsAndMalformedFields|TestProjectListTableByteSizes)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'list-projection-helper-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -p 2 ./internal/readable -count=1 -timeout=2m -v -json -run '^(TestListTableKeepsIDsAndFitsWidth|TestListTableNarrowFallbackKeepsIDs|TestListTableEscapesEveryCell|TestListTableUnicodeWidths|TestListTableEmptyAndMalformedRows)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'list-renderer-helper-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test request configuration
        if: matrix.request-configuration && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^(TestMainGlobalFlagsPlacementHeadersAndOutput|TestMainGlobalFlagsPrecedence|TestMainGlobalFlagsHeaderAliasesAndAuthorization|TestMainGlobalFlagsKeepEndpointFlagsAndLiterals|TestMainGlobalFlagsProjectBodyKeepsRootHeader|TestMainGlobalFlagsDeepAdminAndCustomCommands|TestMainGlobalFlagsHelpAndCompletionStayLocal|TestMainGlobalFlagsErrorOutputPlacement|TestMainGlobalFlagBaseURLOverridesMalformedEnvironment|TestMainGlobalFlagInvalidPercentBaseURLStillFails|TestMainGlobalFlagBaseURLOverridePreservesEnvironmentHeaders|TestMainGlobalFlagInvalidPercentBaseURLErrorsAreSafe|TestMainGlobalFlagEmptyBaseURLKeepsEnvironmentFallback|TestMainGlobalFlagEmptyMTLSOverridesEnvironment|TestMainGlobalFlagMTLSRejectsExplicitDuplicates|TestMainGlobalFlagCompletionScriptsIgnoreRequestConfiguration|TestMainGlobalFlagCompletionWordsRemainRequestValues|TestMainGlobalFlagRequestConfigurationStillValidates|TestMainGlobalFlagURLConfigurationPreservesOfflineHelp)$' \
            | tee "$RUNNER_TEMP/request-configuration-public-tests.jsonl"
          go test -p 2 ./pkg/custom -count=1 -timeout=2m -v -json -run '^(TestRootRequestFlagsPreserveOwnershipAndMetadata|TestRootRequestFlagsPreserveMTLSPlacement|TestRootRequestFlagsRetainSourcesAliasesAndValidation|TestMTLSClientFlagEnvironmentDoesNotConsumeExplicitValue)$' \
            | tee "$RUNNER_TEMP/request-configuration-helper-tests.jsonl"
      - name: Test Windows request configuration
        if: matrix.request-configuration && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^(TestMainGlobalFlagsPlacementHeadersAndOutput|TestMainGlobalFlagsPrecedence|TestMainGlobalFlagsHeaderAliasesAndAuthorization|TestMainGlobalFlagsKeepEndpointFlagsAndLiterals|TestMainGlobalFlagsProjectBodyKeepsRootHeader|TestMainGlobalFlagsDeepAdminAndCustomCommands|TestMainGlobalFlagsHelpAndCompletionStayLocal|TestMainGlobalFlagsErrorOutputPlacement|TestMainGlobalFlagBaseURLOverridesMalformedEnvironment|TestMainGlobalFlagInvalidPercentBaseURLStillFails|TestMainGlobalFlagBaseURLOverridePreservesEnvironmentHeaders|TestMainGlobalFlagInvalidPercentBaseURLErrorsAreSafe|TestMainGlobalFlagEmptyBaseURLKeepsEnvironmentFallback|TestMainGlobalFlagEmptyMTLSOverridesEnvironment|TestMainGlobalFlagMTLSRejectsExplicitDuplicates|TestMainGlobalFlagCompletionScriptsIgnoreRequestConfiguration|TestMainGlobalFlagCompletionWordsRemainRequestValues|TestMainGlobalFlagRequestConfigurationStillValidates|TestMainGlobalFlagURLConfigurationPreservesOfflineHelp)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'request-configuration-public-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -p 2 ./pkg/custom -count=1 -timeout=2m -v -json -run '^(TestRootRequestFlagsPreserveOwnershipAndMetadata|TestRootRequestFlagsPreserveMTLSPlacement|TestRootRequestFlagsRetainSourcesAliasesAndValidation|TestMTLSClientFlagEnvironmentDoesNotConsumeExplicitValue)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'request-configuration-helper-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test Windows native shell and download contracts
        if: matrix.request-configuration && runner.os == 'Windows'
        shell: pwsh
        env:
          GOMAXPROCS: '2'
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: ${{ matrix.shells }}
        run: |
          $ErrorActionPreference = 'Stop'
          go test -p 2 ./cmd/openai -count=1 -timeout=3m -v -json -run '^TestMainShellWindowsNative$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-native-shell-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -p 2 ./pkg/custom -count=1 -timeout=2m -v -json -run '^TestWindowsDownload(AutomaticConsole|PrivateCreation|PrivatePublication|PreservesExistingDACL)$' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-download-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
      - name: Test request environment restoration
        if: matrix.environment
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/openai -count=1 -timeout=2m -v -json \
            -run '^TestRequestConfiguration(RestoresEnvironment|LeavesOtherEnvironmentCasesUnchanged)$' \
            | tee "$RUNNER_TEMP/environment-tests.jsonl"
      - name: Test gallery cleanup
        if: matrix.gallery
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/imagegallery -count=1 -timeout=2m -v -json \
            -run '^TestCleanup(PreservesMalformedMetadata|ResumesAfterPartialArtifactRemoval)$' \
            | tee "$RUNNER_TEMP/gallery-tests.jsonl"
      - name: Test pager descriptor ownership
        if: matrix.pager
        shell: bash
        run: |
          set -euo pipefail
          go test ./pkg/custom -count=1 -timeout=2m -v -json \
            -run '^TestSocketPairPagerFailureKeepsReusedDescriptorOpen$' \
            | tee "$RUNNER_TEMP/pager-tests.jsonl"
      - name: Test Bash command prefixes
        if: matrix.bash-prefixes
        shell: bash
        env:
          OPENAI_CLI_TEST_BASH: /bin/bash
        run: |
          set -euo pipefail
          command -v "$OPENAI_CLI_TEST_BASH"
          "$OPENAI_CLI_TEST_BASH" --version
          command -v expect
          expect -v
          go test ./internal/autocomplete -count=1 -timeout=2m -v -json \
            -run '^TestBashColonCompletionReadline$/^(ordinary|escaped|single_quoted|double_quoted|partially_quoted|open_single_quote|open_double_quote|before_closing_quote|colon_not_a_word_break|multiple_quoted_colons|partially_escaped_colons|first_colon_escaped)$' \
            | tee "$RUNNER_TEMP/bash-prefix-tests.jsonl"
      - name: Verify selected compatibility test execution
        shell: bash
        env:
          CHECK_IMAGE_ORDER: ${{ matrix.image-order || false }}
          CHECK_WELCOME_PUBLIC: ${{ matrix.welcome-public || false }}
          CHECK_REQUEST_CONFIGURATION: ${{ matrix.request-configuration || false }}
          CHECK_LIST_HELPERS: ${{ matrix.list-helpers || false }}
          CHECK_ENVIRONMENT: ${{ matrix.environment || false }}
          CHECK_GALLERY: ${{ matrix.gallery || false }}
          CHECK_PAGER: ${{ matrix.pager || false }}
          CHECK_BASH_PREFIXES: ${{ matrix.bash-prefixes || false }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          completion_root = "TestMainDispatchCompletionEmpty"
          suites = {
              "dispatch-tests.jsonl": {completion_root} | {
                  f"{completion_root}/{style}/{form}"
                  for style in ["bash", "zsh", "fish", "pwsh"]
                  for form in ["no_words", "empty_word"]
              },
          }
          if os.environ["RUNNER_OS"] == "Linux":
              suites.update({
                  "fish-tests.jsonl": {
                      "TestFishFileCompletionPreservesAssignments",
                      "TestFishPackagePickerFirstPrompt",
                      "TestFishPackagePreservesOrdinaryCompletions",
                      "TestPickerFishTabAndLifecycle",
                      "TestPickerFishBindingsAndResourcing",
                      "TestPickerFishRejectsOtherCommandLines",
                      "TestPickerInstalledFishHonorsSharedOptOut",
                      "TestPickerInstalledFishRunsAfterUserConfiguration",
                  },
                  "shell-quoting-tests.jsonl": {
                      "TestImagePickerNativeShellQuoting",
                      "TestImagePickerNativeShellQuoting/zsh",
                      "TestImagePickerNativeShellQuoting/fish",
                  },
