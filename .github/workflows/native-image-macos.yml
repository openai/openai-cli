# One bounded capability experiment; native recipes remain pinned at 23fd98e.
name: PR342 native macOS image proof
on:
  push:
    branches: [codex/pr342-macos-native-proof]
    paths:
      - .github/workflows/native-image-macos.yml
      - scripts/demos/native-images/**
permissions:
  contents: read
concurrency:
  group: pr342-native-macos-proof
  cancel-in-progress: false
jobs:
  opengl-capability:
    if: github.repository == 'openai/openai-cli' && github.ref == 'refs/heads/codex/pr342-macos-native-proof'
    runs-on: macos-15-intel
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Kitty-equivalent native OpenGL capability
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kitty-opengl-capability'
          root.mkdir()
          source = pathlib.Path('scripts/demos/native-images/check_kitty_opengl.m')
          report = {'workflow_sha': os.environ['GITHUB_SHA'], 'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                    'runner_arch': os.environ.get('RUNNER_ARCH'), 'image_version': os.environ.get('ImageVersion'),
                    'scope': 'capability only; no CLI build, terminal launch, or screenshots'}
          try:
              for name, argv, timeout in [
                  ('compile', ['xcrun', 'clang', '-fobjc-arc', '-Wno-deprecated-declarations', '-framework', 'Cocoa',
                               '-framework', 'OpenGL', str(source), '-o', str(root / 'check')], 30),
                  ('probe', [str(root / 'check')], 10),
              ]:
                  with (root / (name + '.stdout')).open('xb') as out, (root / (name + '.stderr')).open('xb') as err:
                      result = subprocess.run(argv, stdin=subprocess.DEVNULL, stdout=out, stderr=err, timeout=timeout)
                  report[name + '_exit'] = result.returncode
                  if result.returncode:
                      raise RuntimeError(name + ' failed; see retained output')
          except BaseException as error:
              report['failure'] = str(error)
              raise
          finally:
              (root / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Preserve capability diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr342-kitty-opengl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kitty-opengl-capability/*.json
            ${{ runner.temp }}/kitty-opengl-capability/*.stdout
            ${{ runner.temp }}/kitty-opengl-capability/*.stderr
          if-no-files-found: error
          retention-days: 7
