name: CI
permissions: {}
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested

jobs:
  source:
    uses: ./.github/workflows/prepare-ci-source.yml
    permissions:
      contents: read
      actions: read

  reference-shadow:
    name: Reference-only shadow report
    if: github.event_name == 'pull_request'
    needs: source
    permissions: {}
    continue-on-error: true # Advisory only; no existing job consumes this result.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - name: Test shadow classifier
        run: python3 -m unittest discover -s scripts/ci -p 'test_reference_shadow.py'
      - name: Report committed scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: python3 scripts/ci/reference_shadow.py --base "$BASE_SHA" --head "$CANDIDATE_SHA" --pr-head "$PR_HEAD_SHA" --output "$RUNNER_TEMP/reference-shadow.json"
      - name: Retain shadow observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reference-shadow.json
          retention-days: 14

  lint:
    timeout-minutes: 15
    name: lint
    needs: source
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"

      - uses: ./.github/actions/setup-go

      - name: Run lints
        run: ./scripts/lint

  macos-uploads:
    timeout-minutes: 15
    name: macOS upload cancellation
    needs: source
    permissions: {}
    runs-on: macos-latest
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: ./.github/actions/setup-go
      - name: Check upload cancellation and EOF
        run: go test ./internal/binaryparam ./pkg/cmd -run 'Test(CancellableFIFO|FilesCreateCLICancelClosesStalledFIFO|FilesCreateCLIStreamsSparseFile|ImagesEditCLIStreamsMultipleFiles)' -count=1
      - name: Check native macOS picker metadata and profile transactions
        run: go test ./internal/autocomplete -run '^TestPicker' -count=1 -v
      - name: Check native macOS shell targeting and setup decisions
        run: go test ./pkg/custom -run '^TestImagePicker(Shell|FirstRun|TabChoice|MacOS)' -count=1 -v

  windows-picker-permissions:
    timeout-minutes: 15
    name: Windows shell setup permissions
    needs: source
    permissions: {}
    runs-on: windows-latest
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: ./.github/actions/setup-go
      - name: Check native Windows ownership, ACLs and profile transactions
        run: go test ./internal/autocomplete -run '^TestPicker(ProfileRecovery.*|Rename.*|RecoveryDirectory.*|Windows.*|FileMetadataPreservesZoneIdentifierAtSnapshotRecheck|ReplacementMetadataKeepsSameInheritedPermissions|SecurityDescriptorComparisonPreservesPermissions|InstallRoundTrip|InstallConfigDirectoryChanges|InstallIgnoresUnusedConfigDirectory|InstallConfigDirectoryRefusalPreservesFiles|InstallPreservesHardLinkedProfiles|ProfileHardLinkAddedAfterSnapshot|ScriptContentChecksLegacyNamespaces|InstallRetriesSupersededScriptCleanup|RemoveRetriesScriptCleanup|RemoveMissingProfileParentCleansOwnedScripts|RemoveMissingProfileAndScriptDirectoriesNoOp|RemoveMissingProfileParentReappearsWhileWaiting|RemovePreservesPersonalLineBoundaries|InstalledDetectsAndRefreshesOlderScript)$' -count=1 -v
      - name: Check Windows shell home targeting
        run: go test ./pkg/custom -run '^TestImagePicker(WindowsShellHome|ShellConsent)' -count=1 -v
      - name: Check Windows stdin startup probing
        run: go test ./pkg/custom -run '^TestWindowsPipedDataAvailable$' -count=1 -v
      - name: Check native Windows shell and file commands
        run: go test -p 2 ./cmd/openai -run '^TestMainShell' -count=1 -v
        env:
          GOMAXPROCS: '2'
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: cmd,powershell,pwsh
      - name: Check native Windows download completion and cleanup
        run: go test -p 2 ./pkg/custom -run '^(TestWindowsDownload|TestManagedDownload|TestDownload|TestAutomaticDownload|TestBinaryResponsePreserves|TestWriteBinaryResponse|TestReportSaveReceipt|TestSaveReceiptContext|TestResponseSaveReceipt)' -count=1 -v
        env:
          GOMAXPROCS: '2'
      - name: Check native Windows Batch stdin and private staging
        run: |
          go test -p 2 ./pkg/custom -run '^TestWindowsBatch(DownloadPrivateStagingAndPublication|OutputDirectory.*)$' -count=1 -timeout=1m -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -p 2 ./cmd/openai -run '^(TestMainBatchesStalledStdinDeadline|TestMainBatchesCompleteStdinControls)$' -count=1 -timeout=2m -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GOMAXPROCS: '2'

  build-artifacts:
    timeout-minutes: 30
    name: build artifacts
    needs: source
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"

      # Artifact builds must not compete with lint for setup-go's immutable cache.
      - name: Set up Go for artifact builds
        id: artifact-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
          cache: false
      - name: Locate Go caches
        id: artifact-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache artifact build dependencies and compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.artifact-cache-paths.outputs.build }}
            ${{ steps.artifact-cache-paths.outputs.modules }}
          # A new revision saves its completed cross-platform build; subsequent
          # revisions restore the most recent compatible artifact-build cache.
          key: artifact-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.artifact-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            artifact-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.artifact-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - uses: ./.github/actions/link-go-sdk
      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Test vulnerability scan coverage
        run: ./scripts/govulncheck-test

      - name: Check shipped CLI for reachable vulnerabilities
        run: ./scripts/govulncheck

      - name: Test verified GoReleaser installer
        run: ./scripts/test-goreleaser-installer

      - name: Set up verified GoReleaser
        id: goreleaser
        uses: ./.github/actions/setup-goreleaser

      - name: Verify local and historical release preflight
        run: go test ./scripts -run '^Test((Local|Historical)ReleasePreflight|LinuxFishPickerPackageArtifacts)$' -count=1
        env:
          GORELEASER_EXECUTABLE: ${{ steps.goreleaser.outputs.executable }}

      - name: Generate release inputs
        run: |
          mkdir -p completions
          go run ./cmd/openai/main.go @completion bash > completions/openai.bash
          go run ./cmd/openai/main.go @completion zsh > completions/openai.zsh
          go run ./cmd/openai/main.go @completion fish > completions/openai.fish
          mkdir -p completions/picker
          go run ./scripts/render-linux-picker > completions/picker/openai.fish
          go run ./cmd/openai/main.go @manpages -o man

          for directory in completions completions/picker man man/man1; do
            [[ -d "$directory" && ! -L "$directory" ]] || exit 1
          done
          for path in completions/openai.bash completions/openai.zsh completions/openai.fish completions/picker/openai.fish man/man1/openai.1.gz; do
            [[ -f "$path" && ! -L "$path" ]] || exit 1
            size="$(wc -c < "$path")"
            [[ "$size" -gt 0 && "$size" -le 10485760 ]] || exit 1
          done

          exclude_file="$(git rev-parse --git-path info/exclude)"
          printf '%s\n' \
            '/completions/openai.bash' \
            '/completions/openai.zsh' \
            '/completions/openai.fish' \
            '/completions/picker/openai.fish' \
            '/man/man1/openai.1.gz' \
            >> "$exclude_file"

      - name: Run GoReleaser
        run: |
          "$GORELEASER_EXECUTABLE" release --snapshot --clean --skip=publish
        env:
          GORELEASER_EXECUTABLE: ${{ steps.goreleaser.outputs.executable }}

  build:
    timeout-minutes: 10
    name: build
    needs:
      - build-artifacts
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build
        env:
          BUILD_RESULT: ${{ needs.build-artifacts.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "Build artifacts failed: $BUILD_RESULT"
            exit 1
          fi

  test-linux:
    timeout-minutes: 15
    name: Linux tests
    needs: source
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"

      - uses: ./.github/actions/setup-go

      - name: Verify mock tooling security
        run: node scripts/mock-tools/security.test.js

      - name: Check Linux picker metadata and profile identity
        run: go test ./internal/autocomplete -run '^TestPicker(InstallRetainsLinuxSELinuxLabel|SecurityLabel.*|InstallPreservesLinuxFileMetadata|LinuxMetadataAddedAfterSnapshotIsKept|UnixProfileIdentityKeepsDistinctCaseNames)$' -count=1 -v

      - name: Run tests
        # Large-payload and subprocess suites share this runner. Avoid running
        # packages concurrently; retain every test, payload and deadline.
        run: ./scripts/test -p 1
        env:
          SKIP_WINDOWS_TEST_COMPILE: '1'

  test-windows-compile:
    timeout-minutes: 15
    name: Windows test compilation
    needs: source
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: ./.github/actions/setup-go
      - name: Compile all test packages for Windows
        run: |
          output=$(mktemp -d)
          trap 'rm -rf "$output"' EXIT
          GOARCH=amd64 GOOS=windows go test -c -o "$output/" ./... -p 1

  test:
    timeout-minutes: 5
    name: test
    needs: [test-linux, test-windows-compile]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful tests and Windows compilation
        env:
          LINUX_RESULT: ${{ needs.test-linux.result }}
          WINDOWS_RESULT: ${{ needs.test-windows-compile.result }}
        run: |
          if [[ "$LINUX_RESULT" != "success" || "$WINDOWS_RESULT" != "success" ]]; then
            echo "Linux tests: $LINUX_RESULT; Windows compilation: $WINDOWS_RESULT"
            exit 1
          fi
