          go test -p 1 ./internal/autocomplete -run '^TestShellSuggestionsAdapters.*$/^pwsh$' -count=1 -timeout=3m -v -json |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'powershell-suggestion-adapter-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
