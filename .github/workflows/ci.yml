          require(proof["go"] == {
              "GOOS": "windows", "GOHOSTOS": "windows",
              "GOARCH": os.environ["EXPECTED_GOARCH"], "GOHOSTARCH": os.environ["EXPECTED_GOARCH"],
          }, "Go host or target differs")
          shell = proof["selectedPowerShell"]
          require(shell["osArchitecture"] == os.environ["EXPECTED_PROCESS_ARCH"] and
                  shell["processArchitecture"] == os.environ["EXPECTED_PROCESS_ARCH"],
                  "PowerShell did not run natively")
          require(shell["edition"] == "Core" and re.fullmatch(r"\d+\.\d+\.\d+", shell["version"]) and
                  int(shell["version"].split(".", 1)[0]) >= 7,
                  "Unsupported PowerShell version")
          require(proof["expectedPowerShell"] == os.environ["EXPECTED_POWERSHELL"], "PowerShell selection differs")
          if proof["expectedPowerShell"] != "current":
              require(shell["version"] == proof["expectedPowerShell"], "Minimum PowerShell version differs")
          require(bool(shell["executable"]) and re.fullmatch(r"[0-9A-F]{64}", proof["selectedSHA256"]),
                  "Missing selected executable identity")
          for filename, (package, expected) in suites.items():
              observed = Counter()
              for line in (directory / filename).read_text(encoding="utf-8").splitlines():
                  event = json.loads(line, object_pairs_hook=unique_object)
                  require(isinstance(event, dict), filename + ": expected a JSON object")
                  action, name = event.get("Action"), event.get("Test", "")
                  require(isinstance(action, str) and isinstance(name, str), filename + ": malformed event")
                  require(action not in {"fail", "skip", "build-fail"}, filename + ": failed or skipped event")
                  if action == "build-output":
                      require(not name and isinstance(event.get("Output"), str), filename + ": malformed build output")
                      continue
                  require(event.get("Package") == "github.com/openai/openai-cli/" + package,
                          filename + ": unexpected package")
                  require(not name or name in expected, filename + ": unexpected named test: " + name)
                  require(action in {"start", "run", "pass", "output"}, filename + ": unexpected action")
                  if action == "output":
                      require(isinstance(event.get("Output"), str), filename + ": malformed output")
                  else:
                      observed[action, name] += 1
              wanted = Counter({("start", ""): 1, ("pass", ""): 1})
              wanted.update({(action, name): 1 for action in ["run", "pass"] for name in expected})
              require(observed == wanted, filename + ": missing, duplicate, or unexpected execution events")
              print(f"{filename}: {len(expected)} named tests ran and passed exactly once; no skips")
          PY
      - name: Retain native Windows suggestion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-suggestions-${{ matrix.goarch }}-${{ matrix.powershell }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shell-suggestion-platform.json
            ${{ runner.temp }}/powershell-suggestion-tests.jsonl
            ${{ runner.temp }}/powershell-suggestion-adapter-tests.jsonl
            ${{ runner.temp }}/public-shell-suggestion-tests.jsonl
          if-no-files-found: error
          retention-days: 7

  build-artifacts:
    timeout-minutes: 30
    name: build artifacts
    needs: source
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"

      # Artifact builds must not compete with lint for setup-go's immutable cache.
      - name: Set up Go for artifact builds
        id: artifact-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
          cache: false
      - name: Locate Go caches
        id: artifact-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache artifact build dependencies and compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.artifact-cache-paths.outputs.build }}
            ${{ steps.artifact-cache-paths.outputs.modules }}
          # A new revision saves its completed cross-platform build; subsequent
          # revisions restore the most recent compatible artifact-build cache.
          key: artifact-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.artifact-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            artifact-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.artifact-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - uses: ./.github/actions/link-go-sdk
      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Test vulnerability scan coverage
        run: ./scripts/govulncheck-test

      - name: Check shipped CLI for reachable vulnerabilities
        run: ./scripts/govulncheck

      - name: Test verified GoReleaser installer
        run: ./scripts/test-goreleaser-installer

      - name: Set up verified GoReleaser
        id: goreleaser
        uses: ./.github/actions/setup-goreleaser

      - name: Verify local and historical release preflight
        run: go test ./scripts -run '^Test((Local|Historical)ReleasePreflight|LinuxFishPickerPackageArtifacts)$' -count=1
        env:
          GORELEASER_EXECUTABLE: ${{ steps.goreleaser.outputs.executable }}

      - name: Generate release inputs
        run: |
          mkdir -p completions
          go run ./cmd/openai/main.go @completion bash > completions/openai.bash
          go run ./cmd/openai/main.go @completion zsh > completions/openai.zsh
          go run ./cmd/openai/main.go @completion fish > completions/openai.fish
          mkdir -p completions/picker
          go run ./scripts/render-linux-picker > completions/picker/openai.fish
          go run ./cmd/openai/main.go @manpages -o man

          for directory in completions completions/picker man man/man1; do
            [[ -d "$directory" && ! -L "$directory" ]] || exit 1
          done
          for path in completions/openai.bash completions/openai.zsh completions/openai.fish completions/picker/openai.fish man/man1/openai.1.gz; do
            [[ -f "$path" && ! -L "$path" ]] || exit 1
            size="$(wc -c < "$path")"
            [[ "$size" -gt 0 && "$size" -le 10485760 ]] || exit 1
          done

          exclude_file="$(git rev-parse --git-path info/exclude)"
          printf '%s\n' \
            '/completions/openai.bash' \
            '/completions/openai.zsh' \
            '/completions/openai.fish' \
            '/completions/picker/openai.fish' \
            '/man/man1/openai.1.gz' \
            >> "$exclude_file"

      - name: Run GoReleaser
        run: |
          "$GORELEASER_EXECUTABLE" release --snapshot --clean --skip=publish
        env:
          GORELEASER_EXECUTABLE: ${{ steps.goreleaser.outputs.executable }}

  build:
    timeout-minutes: 10
    name: build
    needs:
      - build-artifacts
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build
        env:
          BUILD_RESULT: ${{ needs.build-artifacts.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "Build artifacts failed: $BUILD_RESULT"
            exit 1
          fi

  test-linux:
    timeout-minutes: 15
    name: Linux tests
    needs: source
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"

      - uses: ./.github/actions/setup-go

      - name: Verify mock tooling security
        run: node scripts/mock-tools/security.test.js

      - name: Check error audit validator
        run: python3 scripts/test-error-audit.py

      - name: Check Linux picker metadata and profile identity
        run: go test ./internal/autocomplete -run '^TestPicker(InstallRetainsLinuxSELinuxLabel|SecurityLabel.*|InstallPreservesLinuxFileMetadata|LinuxMetadataAddedAfterSnapshotIsKept|UnixProfileIdentityKeepsDistinctCaseNames)$' -count=1 -v

      - name: Check native Bash executable suggestions
        run: go test -p 1 ./internal/autocomplete -run '^TestShellSuggestionsBash' -count=1 -timeout=5m -v
        env:
          GOMAXPROCS: '2'
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: bash

      - name: Run tests
        # Large-payload and subprocess suites share this runner. Avoid running
        # packages concurrently; retain every test, payload and deadline.
        run: ./scripts/test -p 1
        env:
          SKIP_WINDOWS_TEST_COMPILE: '1'

  test-windows-compile:
    timeout-minutes: 15
    name: Windows test compilation
    needs: source
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: ./.github/actions/setup-go
      - name: Compile all test packages for Windows
        # Go owns separate temporary output paths, including packages sharing a
        # directory name such as internal/tokenizer and generated/tokenizer.
        # `true` accepts each compiled Windows binary without executing it.
        run: GOARCH=amd64 GOOS=windows go test -exec=true ./... -p 1

  error-audit:
    timeout-minutes: 15
    name: error audit (${{ matrix.shard }})
    needs: source
    permissions: {}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-inputs
          merge-multiple: true
      - name: Restore candidate checkout
        shell: bash
        run: tar -xzf - < "$RUNNER_TEMP/ci-inputs/ci-source.tar.gz"
      - uses: ./.github/actions/setup-go
      - name: Run exhaustive error audit shard
        shell: bash
        env:
          OPENAI_CLI_ERROR_COVERAGE_MODE: exhaustive
          OPENAI_CLI_ERROR_COVERAGE_SHARD_INDEX: ${{ matrix.shard }}
          OPENAI_CLI_ERROR_COVERAGE_SHARD_COUNT: '4'
          GOMAXPROCS: '2'
        run: |
          go test -p 1 ./cmd/openai -run '^Test(MainErrorCoverageAcrossCommandTree|ErrorCoverage)' -count=1 -timeout=10m -json > "$RUNNER_TEMP/error-audit.jsonl"
          python3 scripts/check-error-audit.py --log "$RUNNER_TEMP/error-audit.jsonl" --shard-index "$OPENAI_CLI_ERROR_COVERAGE_SHARD_INDEX" --shard-count "$OPENAI_CLI_ERROR_COVERAGE_SHARD_COUNT"
      - name: Retain audit log
        if: always()
        continue-on-error: true # Diagnostic upload does not replace shard validation.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: error-audit-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/error-audit.jsonl
          retention-days: 7

  test:
    timeout-minutes: 5
    name: test
    needs: [source, test-linux, test-windows-compile, error-audit]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful tests and error audits
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          LINUX_RESULT: ${{ needs.test-linux.result }}
          WINDOWS_RESULT: ${{ needs.test-windows-compile.result }}
          AUDIT_RESULT: ${{ needs.error-audit.result }}
        run: |
          if [[ "$SOURCE_RESULT" != "success" || "$LINUX_RESULT" != "success" || "$WINDOWS_RESULT" != "success" || "$AUDIT_RESULT" != "success" ]]; then
            echo "Tests failed: source=$SOURCE_RESULT linux=$LINUX_RESULT windows=$WINDOWS_RESULT audit=$AUDIT_RESULT"
            exit 1
          fi
