name: CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  build-artifacts:
    timeout-minutes: 10
    name: build artifacts
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Generate release inputs
        run: |
          mkdir -p completions
          go run ./cmd/openai/main.go @completion bash > completions/openai.bash
          go run ./cmd/openai/main.go @completion zsh > completions/openai.zsh
          go run ./cmd/openai/main.go @completion fish > completions/openai.fish
          go run ./cmd/openai/main.go @manpages -o man

          for directory in completions man man/man1; do
            [[ -d "$directory" && ! -L "$directory" ]] || exit 1
          done
          for path in completions/openai.bash completions/openai.zsh completions/openai.fish man/man1/openai.1.gz; do
            [[ -f "$path" && ! -L "$path" ]] || exit 1
            size="$(wc -c < "$path")"
            [[ "$size" -gt 0 && "$size" -le 10485760 ]] || exit 1
          done

          exclude_file="$(git rev-parse --git-path info/exclude)"
          printf '%s\n' \
            '/completions/openai.bash' \
            '/completions/openai.zsh' \
            '/completions/openai.fish' \
            '/man/man1/openai.1.gz' \
            >> "$exclude_file"

      - name: Read GoReleaser version
        id: goreleaser-version
        run: echo "version=$(cat .goreleaser-version)" >> "$GITHUB_OUTPUT"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    timeout-minutes: 10
    name: build
    needs:
      - build-artifacts
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build
        env:
          BUILD_RESULT: ${{ needs.build-artifacts.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "Build artifacts failed: $BUILD_RESULT"
            exit 1
          fi

  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
