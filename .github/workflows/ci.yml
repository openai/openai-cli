          $env:PATH = $env:SELECTED_POWERSHELL_DIRECTORY + [IO.Path]::PathSeparator + $env:PATH
          go test -p 1 ./internal/autocomplete -run '^TestShellSuggestionsPowerShell' -count=1 -timeout=5m -v -json |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'powershell-suggestion-tests.jsonl') -Encoding utf8NoBOM -ErrorAction Stop
          exit $LASTEXITCODE
        env:
          GOMAXPROCS: '2'
          OPENAI_CLI_REQUIRE_NATIVE_SHELLS: pwsh
          SELECTED_POWERSHELL_DIRECTORY: ${{ steps.powershell.outputs.selected-directory }}
      - name: Check native PowerShell suggestion adapters
        shell: pwsh
        run: |
