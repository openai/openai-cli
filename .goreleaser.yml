project_name: openai
version: 2

release:
  replace_existing_artifacts: true
  extra_files: &linux_release_installers
    - glob: '{{ or (index .Env "OPENAI_LINUX_RELEASE_INSTALLER") "scripts/install-linux-release.sh" }}'
    - glob: scripts/openai.sh

checksum:
  extra_files: *linux_release_installers

builds:
  - id: macos
    goos: [darwin]
    goarch: [amd64, arm64]
    binary: '{{ .ProjectName }}'
    main: ./cmd/openai/main.go
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - '-s -w -X github.com/openai/openai-cli/internal/updatenotice.releaseVersion={{.Version}} -X github.com/openai/openai-cli/internal/updatenotice.releaseCommit={{.Commit}}'

  - id: linux
    goos: [linux]
    goarch: ['386', arm, amd64, arm64]
    env:
      - CGO_ENABLED=0
    binary: '{{ .ProjectName }}'
    main: ./cmd/openai/main.go
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - '-s -w -X github.com/openai/openai-cli/internal/updatenotice.releaseVersion={{.Version}} -X github.com/openai/openai-cli/internal/updatenotice.releaseCommit={{.Commit}}'

  - id: windows
    goos: [windows]
    goarch: ['386', amd64, arm64]
    binary: '{{ .ProjectName }}'
    main: ./cmd/openai/main.go
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - '-s -w -X github.com/openai/openai-cli/internal/updatenotice.releaseVersion={{.Version}} -X github.com/openai/openai-cli/internal/updatenotice.releaseCommit={{.Commit}}'

archives:
  - id: linux-archive
    ids: [linux]
    name_template: '{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [tar.gz]
    files:
      - completions/*
      - man/*/*
      - install.sh
      - openai-enable-updates.sh
      - openai-enable-updates.zsh
  - id: macos-archive
    ids: [macos]
    name_template: '{{ .ProjectName }}_{{ .Version }}_macos_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [zip]
    files:
      - completions/*
      - man/*/*
      - install.sh
      - openai-enable-updates.sh
      - openai-enable-updates.zsh
  - id: windows-archive
    ids: [windows]
    name_template: '{{ .ProjectName }}_{{ .Version }}_windows_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [zip]
    files:
      - completions/*
      - man/*/*
      - Install.cmd

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [macos]

      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"

      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"

snapshot:
  version_template: '{{ .Tag }}-next'

nfpms:
  - license: Apache-2.0
    maintainer: support@openai.com
    bindir: /usr/bin
    formats:
      - apk
      - deb
      - rpm
      - termux.deb
      - archlinux
    contents:
      - src: man/man1/*.1.gz
        dst: /usr/share/man/man1/
      - src: completions/picker/openai.fish
        dst: /usr/share/fish/vendor_conf.d/openai-picker.fish
        file_info:
          mode: 0644
      - src: internal/autocomplete/shellscripts/fish_package_explore.fish
        dst: /usr/share/fish/vendor_conf.d/openai-explore.fish
        file_info:
          mode: 0644
      - src: internal/autocomplete/shellscripts/fish_explore_selection.fish
        dst: /usr/share/openai-cli/explore-selection.fish
        file_info:
          mode: 0644
      - src: install.sh
        dst: /usr/share/openai-cli/install.sh
        packager: deb
      - src: openai-enable-updates.sh
        dst: /usr/share/openai-cli/enable-updates.sh
        packager: deb
      - src: install.sh
        dst: /usr/share/openai-cli/install.sh
        packager: rpm
      - src: openai-enable-updates.sh
        dst: /usr/share/openai-cli/enable-updates.sh
        packager: rpm
homebrew_casks:
  - name: openai
    repository:
      owner: openai
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      # Keep newer releases on the same pending Homebrew PR.
      branch: "openai-update"
      pull_request:
        enabled: true
    # GoReleaser leaves an existing PR's title unchanged when updating its branch.
    commit_msg_template: "Brew cask update for openai"
    homepage: https://developers.openai.com/api/docs
    description: The official CLI for the OpenAI API.
    license: Apache-2.0
    binaries:
      - "openai"
      - "openai-enable-updates.zsh"
    caveats: |
      Run openai help setup to get started.
      The README installation block enables automatic updates in zsh.
      If you ran brew install on its own, you can enable them with:
        source "$(brew --prefix)/bin/openai-enable-updates.zsh"
      After setup, eligible interactive API commands check for updates automatically.
    completions:
      bash: "completions/openai.bash"
      zsh: "completions/openai.zsh"
      fish: "completions/openai.fish"
    manpages:
    - man/man1/openai.1.gz
