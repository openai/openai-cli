project_name: openai
version: 2

release:
  replace_existing_artifacts: true

builds:
  - id: macos
    goos: [darwin]
    goarch: [amd64, arm64]
    binary: '{{ .ProjectName }}'
    main: ./cmd/openai/main.go
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'

  - id: linux
    goos: [linux]
    goarch: ['386', arm, amd64, arm64]
    env:
      - CGO_ENABLED=0
    binary: '{{ .ProjectName }}'
    main: ./cmd/openai/main.go
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'

  - id: windows
    goos: [windows]
    goarch: ['386', amd64, arm64]
    binary: '{{ .ProjectName }}'
    main: ./cmd/openai/main.go
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'

archives:
  - id: linux-archive
    ids: [linux]
    name_template: '{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [tar.gz]
    files:
      - completions/*
      - man/*/*
  - id: macos-archive
    ids: [macos]
    name_template: '{{ .ProjectName }}_{{ .Version }}_macos_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [zip]
    files:
      - completions/*
      - man/*/*
  - id: windows-archive
    ids: [windows]
    name_template: '{{ .ProjectName }}_{{ .Version }}_windows_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [zip]
    files:
      - completions/*
      - man/*/*

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [macos]

      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"

      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"

snapshot:
  version_template: '{{ .Tag }}-next'

nfpms:
  - license: Apache-2.0
    maintainer: support@openai.com
    bindir: /usr/bin
    formats:
      - apk
      - deb
      - rpm
      - termux.deb
      - archlinux
    contents:
      - src: man/man1/*.1.gz
        dst: /usr/share/man/man1/
      - src: completions/picker/openai.fish
        dst: /usr/share/fish/vendor_conf.d/openai-picker.fish
        file_info:
          mode: 0644
homebrew_casks:
  - name: openai
    repository:
      owner: openai
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      # Keep newer releases on the same pending Homebrew PR.
      branch: "openai-update"
      pull_request:
        enabled: true
    # GoReleaser leaves an existing PR's title unchanged when updating its branch.
    commit_msg_template: "Brew cask update for openai"
    homepage: https://developers.openai.com/api/docs
    description: The official CLI for the OpenAI API.
    license: Apache-2.0
    binaries:
      - "openai"
    completions:
      bash: "completions/openai.bash"
      zsh: "completions/openai.zsh"
      fish: "completions/openai.fish"
    hooks:
      post:
        install: |
          # Match first-use setup for CI markers available after Homebrew filtering.
          ci = %w[CI GITHUB_ACTIONS GITLAB_CI TF_BUILD BUILDKITE JENKINS_URL TEAMCITY_VERSION].any? do |name|
            !["", "false", "0"].include?(ENV[name].to_s.b.downcase)
          end
          unless ci
            # Homebrew saves these before filtering the caller's environment.
            # Pass literal argv values: system_command's env: escapes spaces.
            setup_env = %w[ZDOTDIR XDG_CONFIG_HOME SUDO_USER].map do |name|
              value = ENV["HOMEBREW_#{name}"] || ENV[name]
              "#{name}=#{value}" if value
            end.compact
            begin
              system_command "/usr/bin/env",
                             args: setup_env + ["#{staged_path}/openai", "@completion", "--install-picker", "--automatic"],
                             sudo: false,
                             must_succeed: false,
                             timeout: 10,
                             print_stdout: true,
                             print_stderr: true
            rescue Timeout::Error
              warn "Tab shortcut setup timed out; installation will continue."
            end
          end
    manpages:
    - man/man1/openai.1.gz
